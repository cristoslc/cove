# Paths the provider-side secret scanners should not report.
#
# `scripts/spikes/edge-secrets/corpus/` holds twelve fixtures in real secret
# shapes with synthetic values. They exist so the repository's own gate and the
# observe-only edge scanner can prove they detect the shapes that actually
# leaked here, and they are allowlisted in `.gitleaks.toml` for the same reason.
#
# GitHub's secret scanning reads shapes, not intent: it raised
# `openai_api_key` on `pos-openai-key.txt` within seconds of the mirror's first
# push. Nothing in the corpus authenticates anywhere, so the alert is noise that
# will repeat on every fresh clone or mirror unless the path is excluded here.
#
# The exclusion is scoped to the fixture directory, never to a source path.
# Generated fixtures at test time would remove the need for this file, and that
# is the better shape if the corpus ever grows.
paths-ignore:
  - "scripts/spikes/edge-secrets/corpus/**"
