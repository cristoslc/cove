[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"cove.templates" = ["*.j2"]
"cove.resources" = ["**/*"]

[project]
name = "cove-cli"
version = "0.2.0"
description = "Cove management CLI"
requires-python = ">=3.11"
dependencies = [
    "click",
    "cryptography>=42.0.0",
    "jinja2>=3.1",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
]

[project.scripts]
cove = "cove.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tier 0 (unit/config): pytest -m "not e2e and not staging"
# Tier 1 (integration): pytest -m "e2e and not staging"
# Tier 2 (staging E2E): pytest -m staging
# All tiers:           pytest
markers = [
    "e2e: integration tests that build+install the wheel and invoke the cove binary (tier 1)",
    "staging: E2E tests that require a live Cove stack deployed to staging (tier 2)",
]


[dependency-groups]
dev = [
    "pytest",
]
