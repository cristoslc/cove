[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"cove.templates" = ["*.j2"]

[project]
name = "cove-cli"
version = "0.1.0"
description = "Cove management CLI"
requires-python = ">=3.11"
dependencies = [
    "click",
    "jinja2>=3.1",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
]

[project.scripts]
cove = "cove.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]


[dependency-groups]
dev = [
    "pytest",
]
