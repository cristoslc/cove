[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"cove.templates" = ["*.j2"]
"cove.resources" = ["**/*"]

[project]
name = "cove-cli"
version = "0.1.0"
description = "Cove management CLI"
requires-python = ">=3.11"
dependencies = [
    "click",
    "cryptography>=42.0.0",
    "jinja2>=3.1",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
]

[project.scripts]
cove = "cove.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
# E2E tests run by default alongside unit tests (single-command suite).
# They use the session-scoped `_cove_artifact` fixture which builds+installs
# the wheel once; tests self-skip if the build fails.
# To skip e2e: pytest -m "not e2e"
markers = [
    "e2e: end-to-end tests that build+install the wheel and invoke the cove binary",
]


[dependency-groups]
dev = [
    "pytest",
]
