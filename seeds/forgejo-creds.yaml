    vault: Private
    category: login
    fields:
      username: cristos
      password: "{{generate:32}}"
      email[text]: lc.cristos@gmail.com
      host[text]: MBPBK-202602
      url[text]: http://localhost:3000

  - title: "Forgejo MBPBK-202602 SSH"
    vault: Private
