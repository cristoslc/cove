# Spike-only rules, layered over the repo's defaults. Two gaps the repo config
# leaves open: Forgejo tokens have no prefix (bare 40 hex, indistinguishable
# from a commit SHA by shape), and modern OpenAI project keys use an sk-proj-
# form the default rule does not cover.
[extend]
useDefault = true

[[rules]]
id = "forgejo-token-context"
description = "40-hex credential near a credential keyword"
regex = '''(?i)(?:token|bearer|password|secret|api[_-]?key)[^\n]{0,40}\b([0-9a-f]{40})\b'''
secretGroup = 1
keywords = ["token", "bearer", "password", "secret", "api_key", "api-key"]

[[rules]]
id = "openai-project-key"
description = "OpenAI project or legacy key"
regex = '''\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b'''
keywords = ["sk-"]
