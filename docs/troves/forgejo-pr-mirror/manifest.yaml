    title: Official Forgejo repository mirror docs
    highlights:
      - Built-in push/pull mirrors are Git-level only (branches, tags, commits)
      - No issue/PR/label/milestone metadata sync
      - Push mirror force-pushes to remote
      - SSH authentication supported for push mirrors
