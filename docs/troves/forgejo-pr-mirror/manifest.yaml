    title: Real-world Forgejo migration with custom PR import tool
    highlights:
      - Custom private tool imports GitHub PRs into Forgejo as real PRs
      - Workflow: GitHub PR → custom import → Forgejo review/CI → merge → mirror back
      - Push mirror code to GitHub, GitHub auto-marks PR as merged
      - Tool is private, not published
