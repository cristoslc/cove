    highlights:
      - Forgejo → GitHub one-way sync with --feature pull-requests flag
      - Supports issues, PR metadata, repo descriptions, topics
      - Nix/NixOS module, container, CLI deployment
      - Only syncs Forgejo → GitHub direction
