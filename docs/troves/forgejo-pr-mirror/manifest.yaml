    title: Gitea Mirror — auto-sync GitHub repos to Forgejo with metadata
    highlights:
      - GitHub → Forgejo one-way sync with web UI
      - PRs mirrored as enriched issues (not native PR objects) due to API limits
      - Docker Compose, Nix, Proxmox deployment
      - Also syncs issues, labels, milestones, wiki, releases
