---
- name: Download Kata Containers
  ansible.builtin.get_url:
    url: "https://github.com/kata-containers/kata-containers/releases/download/{{ kata_version }}/kata-static-{{ kata_version }}-{{ ansible_architecture }}.tar.xz"
    dest: /tmp/kata.tar.xz
    checksum: "sha256:{{ lookup('file', 'kata-checksums.txt') }}"

- name: Install Kata Containers
  ansible.builtin.unarchive:
    src: /tmp/kata.tar.xz
    dest: /opt/kata
    remote_src: yes
    creates: /opt/kata/bin/kata-runtime

- name: Register Kata RuntimeClass
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: node.k8s.io/v1
      kind: RuntimeClass
      metadata:
        name: kata
      handler: kata-qemu
