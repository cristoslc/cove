---
- name: Download limactl
  ansible.builtin.get_url:
    url: "https://github.com/lima-vm/lima/releases/download/v{{ lima_version }}/lima-{{ lima_version }}-{{ ansible_system | lower }}-{{ ansible_architecture | replace('aarch64', 'arm64') | replace('x86_64', 'amd64') }}.tar.gz"
    dest: /tmp/lima.tar.gz
    checksum: "sha256:{{ lookup('file', 'lima-checksums.txt') }}"

- name: Install limactl
  ansible.builtin.unarchive:
    src: /tmp/lima.tar.gz
    dest: /usr/local/bin
    remote_src: yes
    creates: /usr/local/bin/limactl
