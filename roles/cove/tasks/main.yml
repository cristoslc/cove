---
- name: Ensure cove directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ cove_data_dir }}"
    - "{{ cove_data_dir }}/forgejo/data"
    - "{{ cove_data_dir }}/vault/data"
    - "{{ cove_data_dir }}/vault/secrets"
    - "{{ cove_data_dir }}/registry/data"
    - "{{ cove_data_dir }}/backups/auto-dumps"

- name: Install cove CLI
  include_tasks: install-cove.yml

- name: Configure OS-specific runtime
  include_tasks: "{{ ansible_os_family | lower }}.yml"

- name: Install k3s
  include_tasks: install-k3s.yml

- name: Install Kata Containers
  include_tasks: install-kata.yml

- name: Configure host DNS resolver
  include_tasks: configure-network.yml

- name: Deploy platform manifests
  include_tasks: deploy-platform.yml
