# Secret scanning: a blocking pull-request check that fails when a credential
# literal enters the commit range.
#
# Why this exists: the `MBPBK-CLI-2026-05-23` Forgejo token sat in two tracked
# documents in plain text for months, and nothing blocked it at the door. It was
# found by hand, rotated on 2026-11-02, and redacted afterwards. This gate makes
# the next paste fail before merge.
#
# The scanner is pinned twice: the release version and the SHA-256 of the linux
# x64 tarball published with that release. A silent version bump or a tampered
# download fails the checksum step instead of scanning with something else.
#
# Scanning a RANGE, not the whole history: the revoked literal is still in old
# commits by design (redaction without a history rewrite), so a full-history
# scan would fail forever on a value that no longer works anywhere. Each run
# scans only the commits the pull request or push introduces.
#
# `--redact` keeps a finding from echoing the secret into the job log; the
# report names file, rule, and line.

name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl -fsSL --retry 3 -o "/tmp/${asset}" "$url"
          echo "${GITLEAKS_SHA256}  /tmp/${asset}" | sha256sum -c -
          tar -xzf "/tmp/${asset}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the commits this run introduces
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --quiet origin "$BASE_REF"
            base=$(git merge-base "origin/${BASE_REF}" HEAD)
            range="${base}..HEAD"
          else
            case "$BEFORE_SHA" in
              0000000000000000000000000000000000000000|"")
                # A brand-new branch has no predecessor; scan the tip commit.
                range="${AFTER_SHA}~1..${AFTER_SHA}"
                ;;
              *)
                range="${BEFORE_SHA}..${AFTER_SHA}"
                ;;
            esac
          fi
          echo "scanning range: ${range}"
          gitleaks detect --source . --log-opts "$range" \
            --config .gitleaks.toml --redact --verbose --exit-code 1
