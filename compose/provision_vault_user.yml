- name: Provision a userpass user in Vault for UI login
  hosts: localhost
  gather_facts: true
  vars:
    keystore_account: "{{ ansible_user_id }}"

  tasks:
    - name: Read Vault root token from OS keystore (Darwin)
      ansible.builtin.command:
        argv:
          - security
          - find-generic-password
          - -a
          - "{{ keystore_account }}"
          - -s
          - "{{ vault_keystore_prefix }}/root-token"
          - -w
      when: ansible_system == 'Darwin'
      changed_when: false
      register: root_token_read_darwin
      no_log: true

    - name: Read Vault root token from OS keystore (Linux)
      ansible.builtin.command:
        argv:
          - secret-tool
          - lookup
          - service
          - "{{ vault_keystore_prefix }}/root-token"
          - account
          - "{{ keystore_account }}"
      when: ansible_system == 'Linux'
      changed_when: false
      register: root_token_read_linux
      no_log: true

    - name: Fail if Vault token not present
      ansible.builtin.fail:
        msg: "No Vault root token in OS keystore. Run bootstrap_vault.yml first."
      when: (ansible_system == 'Darwin' and root_token_read_darwin.rc != 0) or
            (ansible_system == 'Linux' and root_token_read_linux.rc != 0)

    - name: Set vault token fact
      ansible.builtin.set_fact:
        vault_token: "{{ root_token_read_darwin.stdout if ansible_system == 'Darwin' else root_token_read_linux.stdout }}"
      no_log: true

    - name: Check if Vault is open
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/health"
        headers:
          Host: vault.cove
        status_code: [200, 429, 501, 503]
        validate_certs: false
      register: vault_health
      changed_when: false

    - name: Fail sealed Vault with clear remediation
      ansible.builtin.fail:
        msg: |
          Vault is sealed. Unseal before provisioning:
            cd {{ playbook_dir }} && ansible-playbook -i inventory.yml bootstrap_vault.yml
      when: vault_health.json.sealed | default(true)

    - name: Render vault-user seed from template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/seeds/vault-user.yaml.example"
        dest: "{{ playbook_dir }}/seeds/vault-user.yaml"
        mode: "0600"
      no_log: true

    - name: Seed 1P with vault user item (renders + executes under op run)
      ansible.builtin.command:
        argv:
          - cove
          - creds
          - 1p-bulk-write
          - "{{ playbook_dir }}/seeds/vault-user.yaml"
          - --execute
      changed_when: false

    - name: Cache user password in Vault (no-op if already cached)
      ansible.builtin.command:
        argv:
          - cove
          - creds
          - vault-put
          - "{{ vault_user_op_ref }}"
      register: user_pw_resolve
      changed_when: false

    - name: Set user password fact
      ansible.builtin.set_fact:
        vault_ui_password: "{{ user_pw_resolve.stdout }}"
      no_log: true

    - name: List enabled auth methods
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/auth"
        headers:
          Host: vault.cove
          X-Vault-Token: "{{ vault_token }}"
        status_code: 200
        validate_certs: false
      register: auth_list
      no_log: true

    - name: Enable userpass auth method
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/auth/userpass"
        method: POST
        headers:
          Host: vault.cove
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          type: userpass
        status_code: [204, 400]
        validate_certs: false
      when: "'userpass/' not in auth_list.json"

    - name: Write admin policy
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/policies/acl/{{ vault_ui_policy_name }}"
        method: POST
        headers:
          Host: vault.cove
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          policy: |
            path "*" {
              capabilities = ["create", "read", "update", "delete", "list", "sudo"]
            }
        status_code: 204
        validate_certs: false

    - name: Create or update userpass user
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/userpass/users/{{ vault_ui_username }}"
        method: POST
        headers:
          Host: vault.cove
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          password: "{{ vault_ui_password }}"
          token_policies: "{{ vault_ui_policy_name }}"
        status_code: 204
        validate_certs: false
      no_log: true

    - name: Print summary
      ansible.builtin.debug:
        msg: |
          Vault UI user provisioned.
            URL: {{ vault_addr }}/ui/
            Method: Username (userpass)
            Username: {{ vault_ui_username }}
            Password: in 1Password as {{ vault_user_op_ref }}
            Policy: {{ vault_ui_policy_name }} (full sudo equivalent)

          Root token stays in OS keystore for emergency / unseal use only.
