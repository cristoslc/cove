# Bifrost egress allowlist (DNS choke point) for the bifrost profile.
# The gateway container's ONLY DNS server is this sink (compose `dns:`), so
# every hostname it resolves goes through here. Fail-closed: everything is
# NXDOMAIN-sunk EXCEPT the three allowlisted vendor endpoints below (two
# inference providers plus Bifrost's documented pricing-catalog fetch).
#
# Enforcement-beats-verification (docs/musings/litellm-exit.md): this is
# enforcement at the resolution layer, not a packet audit. Caveat recorded in
# docs/services/bifrost.md: direct-IP egress (no hostname lookup) is NOT
# covered by DNS enforcement; image pinning + the vendored digest are the
# remaining anchors for that residue.

# Never consult /etc/resolv.conf (or Docker's embedded DNS upstream): the
# only upstreams are the explicit server= lines below.
no-resolv
# Never answer from /etc/hosts.
no-hosts
# NXDOMAIN everything that is not explicitly allowlisted below: with no
# other server configured, `local=/#/` marks every domain local (i.e. not
# forwardable), so unlisted names fail fast instead of leaking upstream.
local=/#/

# Allowlisted vendor endpoints. The two inference providers' hostnames come
# from compose/bifrost/config.json base_urls. getbifrost.ai is Bifrost's
# documented PRICING-CATALOG fetch: the gateway loads its pricing catalog at
# STARTUP and exits (not degraded-start) when it cannot reach it, which
# crash-looped the container behind this sink (2026-10-26 converge). The
# allowlist's purpose is preventing QUIET egress growth, not forbidding every
# vendor contact: a startup fetch of a public pricing catalog is not
# telemetry and carries no prompt data. Vendoring a pricing snapshot was
# rejected — it goes stale, and wrong cost numbers are worse than a known
# contact. This is one of exactly three vendor contacts; everything else
# stays NXDOMAIN-sunk.
server=/api.synthetic.new/9.9.9.9
server=/ollama.com/9.9.9.9
server=/getbifrost.ai/9.9.9.9

# Cache answers so the allowlisted providers are not re-resolved per request.
cache-size=4096