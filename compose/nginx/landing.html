<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cove</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
  .container { max-width: 640px; width: 100%; }
  h1 { font-size: 2rem; font-weight: 600; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit; transition: border-color 0.15s; }
  .card:hover { border-color: var(--accent); }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--muted); }
  .status-dot.up { background: var(--green); }
  .status-dot.down { background: var(--red); }
  .card-content { flex: 1; }
  .card-title { font-weight: 500; font-size: 1rem; }
  .card-url { color: var(--muted); font-size: 0.8rem; font-family: 'SF Mono', 'Fira Code', monospace; }
  .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 1.5rem 0 0.5rem; }
  .link-row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .link-row a { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
  .link-row a:hover { text-decoration: underline; }
  .footer { margin-top: 2rem; color: var(--muted); font-size: 0.75rem; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <h1>Cove</h1>
  <p class="subtitle">Local developer platform</p>

  <div class="section-title">Services</div>

  <a class="card" href="https://git.cove.local/" id="forgejo">
    <span class="status-dot" id="dot-forgejo"></span>
    <div class="card-content">
      <div class="card-title">Forgejo</div>
      <div class="card-url">git.cove.local</div>
    </div>
  </a>

  <a class="card" href="https://vault.cove.local/" id="vault">
    <span class="status-dot" id="dot-vault"></span>
    <div class="card-content">
      <div class="card-title">Vault</div>
      <div class="card-url">vault.cove.local</div>
    </div>
  </a>

  <a class="card" href="https://litellm.cove.local/" id="litellm">
    <span class="status-dot" id="dot-litellm"></span>
    <div class="card-content">
      <div class="card-title">LiteLLM</div>
      <div class="card-url">litellm.cove.local</div>
    </div>
  </a>

  <div class="section-title">Links</div>
  <div class="link-row">
    <a href="/config/">Configuration</a>
    <a href="/config/ca">Root CA</a>
  </div>

  <div class="footer">
    Cove &mdash; <span id="version"></span>
  </div>
</div>

<script>
const services = ['forgejo', 'vault', 'litellm'];
async function checkHealth() {
  for (const svc of services) {
    const dot = document.getElementById('dot-' + svc);
    try {
      const resp = await fetch('https://hc.cove.local/', { method: 'HEAD', cache: 'no-store' });
      dot.className = 'status-dot ' + (resp.ok ? 'up' : 'down');
    } catch {
      dot.className = 'status-dot down';
    }
  }
}
checkHealth();
</script>
</body>
</html>
