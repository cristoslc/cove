# Shared config endpoints — included by server blocks that serve /config/*.
# Extracted to avoid duplicating 30+ lines across 4 server blocks.
# nginx alias directives do not inherit from include files with regex
# server_name matching, so each server block includes this file directly.

location = /config/ {
    alias /etc/nginx/config.html;
    add_header Content-Type text/html;
}

location = /config/ca {
    alias /certs/rootCA.pem;
    add_header Content-Type application/x-pem-file;
    add_header Content-Disposition 'attachment; filename="cove-root-ca.pem"';
}

# Auto-detect: serve platform-appropriate DNS config based on User-Agent.
# For iOS, the Content-Type must be application/x-apple-aspen-config so
# Safari offers "Install Profile". For Android/unknown, serve as text/plain
# so instructions display in-browser. For macos/linux/windows, serve as
# downloadable shell script.
location = /config/dns {
    alias /etc/nginx/config/dns/$config_dns_type;
    add_header Content-Type text/x-shellscript;
    add_header Content-Disposition 'attachment; filename="cove-dns-setup.sh"';
}

location = /config/dns/ios {
    alias /etc/nginx/config/dns/ios;
    add_header Content-Type application/x-apple-aspen-config;
    add_header Content-Disposition 'attachment; filename="cove.mobileconfig"';
}

location = /config/dns/android {
    alias /etc/nginx/config/dns/android;
    add_header Content-Type text/plain;
}

location ~ ^/config/dns/(macos|linux|windows)$ {
    alias /etc/nginx/config/dns/$1;
    add_header Content-Type text/x-shellscript;
    add_header Content-Disposition 'attachment; filename="cove-dns-setup.sh"';
}

location = /dns-query {
    proxy_pass http://dnsmasq:8053;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}