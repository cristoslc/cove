<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cove Pages</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
  .container { max-width: 640px; width: 100%; }
  h1 { font-size: 2rem; font-weight: 600; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit; transition: border-color 0.15s; }
  .card:hover { border-color: var(--accent); }
  .card-content { flex: 1; }
  .card-title { font-weight: 500; font-size: 1rem; }
  .card-url { color: var(--muted); font-size: 0.8rem; font-family: 'SF Mono', 'Fira Code', monospace; }
  .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 1.5rem 0 0.5rem; }
  .link-row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .link-row a { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
  .link-row a:hover { text-decoration: underline; }
  .footer { margin-top: 2rem; color: var(--muted); font-size: 0.75rem; text-align: center; }
  .empty { color: var(--muted); text-align: center; padding: 2rem 0; }
  .owner { margin-bottom: 1.5rem; }
  .owner-title { font-size: 0.9rem; font-weight: 600; color: var(--accent); margin-bottom: 0.5rem; }
</style>
</head>
<body>
<div class="container">
  <h1>Cove Pages</h1>
  <p class="subtitle">Static sites hosted on Cove</p>

  <div class="link-row" style="margin-bottom: 1.5rem;">
    <a href="/">← Cove</a>
  </div>

  <div id="pages">
    <div class="empty">Loading pages…</div>
  </div>

  <div class="footer">
    Cove Pages &mdash; <span id="version"></span>
  </div>
</div>

<script>
const API = '/api/owners/';

async function fetchJSON(url) {
  const resp = await fetch(url, { cache: 'no-store' });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}

function siteUrl(owner, repo) {
  return 'https://' + owner + '.pages.cove.local/' + repo + '/';
}

async function load() {
  const container = document.getElementById('pages');
  try {
    const owners = await fetchJSON(API);
    const dirs = owners.filter(e => e.type === 'directory');
    if (dirs.length === 0) {
      container.innerHTML = '<div class="empty">No pages deployed yet.</div>';
      return;
    }
    let html = '';
    for (const owner of dirs) {
      const repos = await fetchJSON(API + encodeURIComponent(owner.name) + '/');
      const repoDirs = repos.filter(e => e.type === 'directory');
      html += '<div class="owner"><div class="owner-title">' + owner.name + '</div>';
      if (repoDirs.length === 0) {
        html += '<div class="empty">No sites.</div>';
      } else {
        for (const repo of repoDirs) {
          const url = siteUrl(owner.name, repo.name);
          html += '<a class="card" href="' + url + '">' +
            '<div class="card-content">' +
            '<div class="card-title">' + repo.name + '</div>' +
            '<div class="card-url">' + url.replace(/^https:\/\//, '') + '</div>' +
            '</div></a>';
        }
      }
      html += '</div>';
    }
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<div class="empty">Could not load pages: ' + e.message + '</div>';
  }
}
load();
</script>
</body>
</html>
