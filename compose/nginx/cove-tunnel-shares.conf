# Rendered by `cove tunnel` — public share routes (<name>.shares.zrok.io).
# State: COVE_TUNNEL_SHARES in the compose .env. Do not edit.

# z8ba1y38t49b.shares.zrok.io -> http://speedtest-tracker:80 (rendered by `cove tunnel`; do not edit)
server {
    listen 80;
    server_name z8ba1y38t49b.shares.zrok.io;

    resolver 127.0.0.11 valid=10s;
    location / {
        set $tunnel_upstream http://speedtest-tracker:80;
        proxy_pass $tunnel_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
