server {
    listen 80;
    server_name git.cove.local ~^[a-zA-Z0-9-]+\.pages\.cove\.local$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name git.cove.local;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;

    location / {
        proxy_pass http://forgejo:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name ~^[a-zA-Z0-9-]+\.pages\.cove\.local$;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;

    # TLS is provided by mkcert wildcard cert for *.cove.local + git.cove.local

    set $owner_path "";
    if ($host ~ "^([^.]+)\.pages\.") {
        set $owner_path $1;
    }

    root /data/pages/sites/$owner_path;

    # Owner root site (the "pages" repo) lives in .index/;
    # other repos are served from /{repo}/.
    #   GET /                     → .index/           (owner root)
    #   GET /my-docs/             → my-docs/           (named repo)
    #   GET /my-docs/sub/page     → my-docs/sub/page
    location / {
        try_files /.index$uri /.index$uri/index.html $uri $uri/index.html =404;
    }

    location = /_health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
