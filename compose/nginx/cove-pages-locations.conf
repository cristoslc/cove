# Pages listing API — served by the pages.cove server block.
# Uses nginx autoindex JSON output to enumerate deployed sites from the
# pages data directory. The pages.html page fetches these endpoints to
# render the site list.
#
#   /api/owners/          → JSON array of owner directories
#   /api/owners/<owner>/  → JSON array of that owner's site directories
#
# autoindex hides dotfiles, so an owner's root site (deployed to
# <owner>/.index) is not listed here — only named repos appear.

location = /api/owners/ {
    alias /data/pages/sites/;
    autoindex on;
    autoindex_format json;
    add_header Content-Type application/json;
}

location ~ ^/api/owners/(?<owner>[a-zA-Z0-9-]+)/$ {
    alias /data/pages/sites/$owner/;
    autoindex on;
    autoindex_format json;
    add_header Content-Type application/json;
}
