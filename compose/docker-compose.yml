name: cove

services:
  forgejo:
    image: ${FORGEJO_IMAGE:-codeberg.org/forgejo/forgejo:15}
    container_name: ${FORGEJO_CONTAINER_NAME:-cove-forgejo}
    restart: unless-stopped
    environment:
      TZ: "${FORGEJO_TZ:-America/New_York}"
      USER_UID: "${FORGEJO_UID:-501}"
      USER_GID: "${FORGEJO_GID:-20}"
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:-localhost}
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:-http://localhost:3000/}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_SSH_DOMAIN:-localhost}
      FORGEJO__server__SSH_PORT: "${FORGEJO_SSH_PORT:-2222}"
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__log__LEVEL: warn
      FORGEJO__server__PROTOCOL: http
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__REDIRECT_OTHER_PORT: "false"
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "true"
      FORGEJO__repository__ENABLE_PUSH_CREATE_ORG: "true"
      FORGEJO__repository.signing__SIGNING_KEY: "default"
      FORGEJO__repository.signing__SIGNING_NAME: "Forgejo"
      FORGEJO__repository.signing__SIGNING_EMAIL: "forgejo@${FORGEJO_DOMAIN:-localhost}"
      FORGEJO__repository.signing__INITIAL_COMMIT: "always"
      FORGEJO__repository.signing__DEFAULT_TRUST_MODEL: "committer"
      FORGEJO__server__LFS_START_SERVER: "true"
    volumes:
      - ${FORGEJO_DATA_ROOT}/forgejo/gitea:/data/gitea
      - ${FORGEJO_DATA_ROOT}/forgejo/git:/data/git
      - ${FORGEJO_DATA_ROOT}/forgejo/ssh:/etc/ssh
      - ${FORGEJO_DATA_ROOT}/certs:/certs:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "0.0.0.0:${FORGEJO_SSH_PORT:-2222}:22"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: ${NGINX_CONTAINER_NAME:-cove-nginx}
    restart: unless-stopped
    depends_on:
      forgejo:
        condition: service_started
      vault:
        condition: service_started
    volumes:
      - ${NGINX_CONF_DIR:-./nginx}/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_CONF_DIR:-./nginx}/cove-config-locations.conf:/etc/nginx/cove-config-locations.conf:ro
      - ${COVE_DATA_ROOT}/certs:/certs:ro
      - ${COVE_DATA_ROOT}/pages/sites:/data/pages/sites:ro
      - ${COVE_DATA_ROOT}/nginx/user.d:/etc/nginx/user.d:ro
      - ${COVE_DATA_ROOT}/nginx/config.html:/etc/nginx/config.html:ro
      - ${COVE_DATA_ROOT}/nginx/config/dns:/etc/nginx/config/dns:ro
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
      # NOTE: Forgejo Actions runners that use deploy-pages must also mount
      # ${COVE_DATA_ROOT}/pages/sites:/data/pages/sites (read-write) so the
      # action can write site files that nginx serves read-only here.
    ports:
      - "0.0.0.0:${NGINX_HTTPS_PORT:-8443}:443"
      - "0.0.0.0:${NGINX_HTTP_PORT:-8080}:80"

  dnsmasq:
    build: ${DNSMASQ_CONF_DIR:-./dnsmasq}
    container_name: ${DNSMASQ_CONTAINER_NAME:-cove-dnsmasq}
    restart: unless-stopped
    volumes:
      - ${COVE_DATA_ROOT}/dnsmasq/cove.conf:/etc/dnsmasq.d/cove.conf:ro
    ports:
      - "0.0.0.0:${DNSMASQ_PORT:-5353}:5353"
    cap_add:
      - NET_BIND_SERVICE

  dnsproxy:
    image: adguard/dnsproxy:latest
    container_name: ${DNSPROXY_CONTAINER_NAME:-cove-dnsproxy}
    restart: unless-stopped
    depends_on:
      dnsmasq:
        condition: service_started
    command:
      - "--https-port=8053"
      - "--port=0"
      - "--tls-port=0"
      - "--upstream=dnsmasq:5353"
      - "--tls-crt=/certs/cove.local.pem"
      - "--tls-key=/certs/cove.local-key.pem"
    volumes:
      - ${COVE_DATA_ROOT}/certs/cove.local.pem:/certs/cove.local.pem:ro
      - ${COVE_DATA_ROOT}/certs/cove.local-key.pem:/certs/cove.local-key.pem:ro

  vault:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.20}
    container_name: ${VAULT_CONTAINER_NAME:-cove-vault}
    restart: unless-stopped
    # IPC_LOCK added even though disable_mlock=true to maintain the
    # capability in case mlock is re-enabled on this single-node setup.
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "https://vault.cove/"
      VAULT_API_ADDR: "http://127.0.0.1:8200"
    command: ["server"]
    volumes:
      - ${COVE_DATA_ROOT}/vault/data:/vault/data
      - ${COVE_DATA_ROOT}/vault/logs:/vault/logs
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      start_period: 15s
      retries: 5

  litellm:
    profiles: ["litellm"]
    build:
      context: ./litellm
      dockerfile: Dockerfile
    image: ${LITELLM_IMAGE:-cove-litellm:1.84.0}
    container_name: ${LITELLM_CONTAINER_NAME:-cove-litellm}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/litellm
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_CONFIG: /app/config.yaml
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4000/health"]
      interval: 15s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${LITELLM_MEM_LIMIT:-512M}

  headroom:
    profiles: ["litellm"]
    image: ${HEADROOM_IMAGE:-ghcr.io/chopratejas/headroom:latest@sha256:50b85d8e320cfcdf1b38919bb7ae067b93ff7a8de0a93f05b2c1246370200d1c}
    container_name: ${HEADROOM_CONTAINER_NAME:-cove-headroom}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${HEADROOM_PORT:-4001}:4001"
    environment:
      HEADROOM_MODEL: local
      HEADROOM_PORT: "4001"
    deploy:
      resources:
        limits:
          memory: ${HEADROOM_MEM_LIMIT:-256M}