- name: Bring up cove containers (forgejo + vault)
  hosts: localhost
  gather_facts: true
  vars:
    compose_dir: "{{ playbook_dir }}"

  tasks:
    - name: Assert admin_username is set
      ansible.builtin.assert:
        that:
          - admin_username | length > 0
        fail_msg: >
          admin_username is empty. Provide it via host_vars/<hostname>.yml
          (run `cove up` to auto-generate) or set COVE_ADMIN_USERNAME.

    - name: Set Forgejo URLs
      ansible.builtin.set_fact:
        cove_domain: cove
        forgejo_domain: git.cove.local
        forgejo_root_url: "https://git.cove.local/"
        forgejo_ssh_domain: git.cove.local

    - name: Detect docker CLI presence (macOS)
      when: ansible_system == "Darwin"
      ansible.builtin.command: command -v docker
      register: docker_cli_detect
      changed_when: false
      failed_when: false

    - name: Bootstrap docker CLI via Homebrew (macOS)
      when:
        - ansible_system == "Darwin"
        - docker_cli_detect.rc != 0
      ansible.builtin.shell: brew install docker
      changed_when: true

    - name: Detect docker compose plugin (macOS)
      when: ansible_system == "Darwin"
      ansible.builtin.command: docker compose version
      register: compose_detect
      changed_when: false
      failed_when: false

    - name: Bootstrap docker compose plugin via Homebrew (macOS)
      when:
        - ansible_system == "Darwin"
        - compose_detect.rc != 0
      ansible.builtin.shell: brew install docker-compose
      changed_when: true

    - name: Register Homebrew docker cli-plugins dir for compose (macOS)
      when: ansible_system == "Darwin"
      ansible.builtin.shell: |
        set -eo pipefail
        CFG="{{ ansible_user_dir }}/.docker/config.json"
        mkdir -p "$(dirname "$CFG")"
        PLUGIN_DIR="/opt/homebrew/lib/docker/cli-plugins"
        python3 - "$CFG" "$PLUGIN_DIR" <<'PY'
        import json, os, sys
        cfg_path, plugin_dir = sys.argv[1], sys.argv[2]
        cfg = {}
        if os.path.exists(cfg_path):
            with open(cfg_path) as f:
                cfg = json.load(f)
        dirs = cfg.get("cliPluginsExtraDirs") or []
        if plugin_dir not in dirs:
            cfg["cliPluginsExtraDirs"] = dirs + [plugin_dir]
            with open(cfg_path, "w") as f:
                json.dump(cfg, f, indent=2)
                f.write("\n")
            print("added")
        else:
            print("already present")
        PY
      register: compose_plugin_cfg
      changed_when: "'added' in compose_plugin_cfg.stdout and 'already' not in compose_plugin_cfg.stdout"

    - name: Ensure Colima is running (macOS)
      when: ansible_system == "Darwin"
      block:
        - name: Start Colima (idempotent — no-op if already running)
          ansible.builtin.command: colima start
          changed_when: false

        - name: Switch Docker context to Colima
          ansible.builtin.command: docker context use colima
          changed_when: true

        - name: Wait for Docker daemon to be ready
          ansible.builtin.command: docker info
          register: docker_info
          retries: 15
          delay: 2
          until: docker_info.rc == 0
          changed_when: false
          ignore_errors: true

        - name: Restart Colima if daemon is unresponsive
          when: docker_info is failed
          block:
            - name: Stop Colima
              ansible.builtin.command: colima stop
              changed_when: true

            - name: Start Colima
              ansible.builtin.command: colima start
              changed_when: true

            - name: Wait for Docker daemon to be ready (after restart)
              ansible.builtin.command: docker info
              register: docker_info_retry
              retries: 15
              delay: 2
              until: docker_info_retry.rc == 0
              changed_when: false

    - name: Check if tailscale is up
      ansible.builtin.command: tailscale status --json
      register: ts_status
      changed_when: false
      failed_when: false
      no_log: true

    - name: Get tailscale DNS name
      when:
        - ts_status.rc == 0
        - (ts_status.stdout | default('{}') | from_json).Self is not none
      ansible.builtin.set_fact:
        ts_dns_name: "{{ (ts_status.stdout | default('{}') | from_json).Self.DNSName | regex_replace('\\.$', '') }}"

    - name: Get tailscale IP
      when:
        - ts_status.rc == 0
        - (ts_status.stdout | default('{}') | from_json).Self is not none
        - (ts_status.stdout | default('{}') | from_json).Self.TailscaleIPs is not none
        - (ts_status.stdout | default('{}') | from_json).Self.TailscaleIPs | length > 0
      ansible.builtin.set_fact:
        ts_ip: "{{ (ts_status.stdout | default('{}') | from_json).Self.TailscaleIPs[0] }}"

    - name: Fallback to LAN IP if Tailscale is down or has no IPs
      when: >
        ts_status.rc != 0
        or (ts_status.stdout | default('{}') | from_json).Self is none
        or (ts_status.stdout | default('{}') | from_json).Self.TailscaleIPs is none
        or (ts_status.stdout | default('{}') | from_json).Self.TailscaleIPs | length == 0
      ansible.builtin.set_fact:
        ts_ip: "{{ ansible_default_ipv4.address }}"

    - name: Configure tailscale serve for HTTPS on port 443
      when:
        - ts_status.rc == 0
        - (ts_status.stdout | default('{}') | from_json).Self is not none
        - (ts_status.stdout | default('{}') | from_json).Self.Online
      ansible.builtin.shell: |
        set -eo pipefail
        JSON=$(tailscale serve status --json 2>/dev/null || echo '{}')
        if echo "$JSON" | python3 -c "import json,sys; s=json.load(sys.stdin); exit(0 if s.get('Web',{}).get('443') else 1)"; then
          echo "already configured"
        else
          tailscale serve --bg --https "443" https://127.0.0.1:{{ nginx_https_port }}
          echo "configured"
        fi
      register: ts_serve_https
      changed_when: "'configured' in ts_serve_https.stdout and 'already' not in ts_serve_https.stdout"

    - name: Ensure root CA exists
      ansible.builtin.command: >
        cove certs ensure-ca
        {% if cove_skip_ca_install | default(false) %}--skip-trust-store{% endif %}
      register: ca_ensure
      changed_when: false
      failed_when: false

    - name: Detect CA path
      ansible.builtin.command: cove certs ca-path
      register: ca_path_result
      changed_when: false
      failed_when: false

    - name: Set CA path fact
      when: ca_path_result.rc == 0
      ansible.builtin.set_fact:
        ca_path: "{{ ca_path_result.stdout }}"

    - name: Read root CA certificate
      when: ca_path_result.rc == 0
      ansible.builtin.slurp:
        src: "{{ ca_path }}/rootCA.pem"
      register: root_ca_slurp

    - name: Ensure certs directory in compose dir
      ansible.builtin.file:
        path: "{{ compose_dir }}/certs"
        state: directory
        mode: "0755"

    - name: Copy rootCA.pem into compose dir for container mount
      when: ca_path_result.rc == 0
      ansible.builtin.copy:
        dest: "{{ compose_dir }}/certs/rootCA.pem"
        mode: "0644"
        content: "{{ root_ca_slurp.content | b64decode }}"

    - name: Base64-encode root CA (strip PEM headers for .mobileconfig)
      when: ca_path_result.rc == 0
      ansible.builtin.set_fact:
        root_ca_b64: "{{ (root_ca_slurp.content | b64decode | regex_replace('-----BEGIN CERTIFICATE-----\\n?', '') | regex_replace('-----END CERTIFICATE-----\\n?', '') | regex_replace('\\n', '') | trim) }}"

    - name: Generate UUIDs for iOS profile
      ansible.builtin.shell: python3 -c "import uuid; print(uuid.uuid4()); print(uuid.uuid4()); print(uuid.uuid4())"
      register: uuids
      changed_when: false

    - name: Set UUID facts
      ansible.builtin.set_fact:
        ca_uuid: "{{ uuids.stdout_lines[0] }}"
        dns_uuid: "{{ uuids.stdout_lines[1] }}"
        profile_uuid: "{{ uuids.stdout_lines[2] }}"

    # Runs on EVERY `cove up` (no creates: guard): `cove certs sign` is
    # drift-aware — it no-ops when the existing cert covers exactly the
    # requested SANs and regenerates when they diverge (e.g. a cert minted
    # before a new required hostname existed). The creates-guard here caused
    # the v0.7.0 regression: existing deployments failed validation with
    # MISSING: ade.cove because the healing sign never ran. changed_when
    # reads the CLI's Signed/Up-to-date verdict; a regenerated leaf is only
    # picked up by the running nginx after a reload, hence the notify.
    - name: Sign TLS cert (idempotent — regenerates when SANs drift)
      ansible.builtin.command:
        argv:
          - cove
          - certs
          - sign
          - --sans
          - "*.cove"
          - --sans
          - "*.cove.local"
          - --sans
          - "*.cove.{{ ansible_hostname }}"
          - --sans
          - "*.cove.local.{{ ansible_hostname }}"
          - --sans
          - cove
          - --sans
          - cove.local
          - --sans
          - git.cove
          - --sans
          - git.cove.local
          - --sans
          - vault.cove
          - --sans
          - vault.cove.local
          - --sans
          - ade.cove
          - --sans
          - ade.cove.local
          - --sans
          - litellm.cove
          - --sans
          - litellm.cove.local
          - --sans
          - speedtest.cove
          - --sans
          - speedtest.cove.local
          - --sans
          - mcp.cove
          - --sans
          - mcp.cove.local
          - --sans
          - hc.cove
          - --sans
          - hc.cove.local
          - --sans
          - ca.cove
          - --sans
          - ca.cove.local
          - --sans
          - "*.pages.cove"
          - --sans
          - "*.pages.cove.local"
          - --sans
          - localhost
          - --sans
          - 127.0.0.1
          - --sans
          - "::1"
          - --key-file
          - "{{ cove_data_root }}/certs/cove.local-key.pem"
          - --cert-file
          - "{{ cove_data_root }}/certs/cove.local.pem"
      register: cert_sign_result
      changed_when: "'Signed:' in cert_sign_result.stdout"
      notify: Reload nginx

    - name: Validate TLS cert covers required hostnames
      ansible.builtin.shell: |
        set -eo pipefail
        CERT="{{ cove_data_root }}/certs/cove.local.pem"
        for host in \
          "git.cove" "git.cove.local" \
          "vault.cove" "vault.cove.local" \
          "ade.cove" "ade.cove.local" \
          "litellm.cove" "litellm.cove.local" \
          "speedtest.cove" "speedtest.cove.local" \
          "mcp.cove" "mcp.cove.local" \
          "hc.cove" "hc.cove.local" \
          "ca.cove" "ca.cove.local" \
          "*.cove" "*.cove.local" \
          "*.cove.{{ ansible_hostname }}" "*.cove.local.{{ ansible_hostname }}" \
          "cove" "cove.local" \
          "*.pages.cove" "*.pages.cove.local"; do
          if ! openssl x509 -in "$CERT" -text -noout | grep -qF "DNS:$host"; then
            echo "MISSING: $host"
            exit 1
          fi
        done
        echo "OK"
      changed_when: false

    - name: Add *.cove hostnames to /etc/hosts
      become: true
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.0\.1\s+.*cove(\s|$)'
        line: "127.0.0.1 cove cove.local git.cove git.cove.local vault.cove vault.cove.local ade.cove ade.cove.local litellm.cove litellm.cove.local speedtest.cove speedtest.cove.local mcp.cove mcp.cove.local hc.cove hc.cove.local ca.cove ca.cove.local pages.cove pages.cove.local"
        state: present
      failed_when: false

    - name: Forward localhost:443 → localhost:{{ nginx_https_port }} via pf
      become: true
      when: ansible_system == "Darwin"
      ansible.builtin.shell: |
        set -eo pipefail
        if pfctl -s nat 2>/dev/null | grep -q '{{ nginx_https_port }}'; then
          echo "already configured"
        else
          RDR='rdr pass on lo0 inet proto tcp from any to 127.0.0.1 port 443 -> 127.0.0.1 port {{ nginx_https_port }}'
          printf 'rdr-anchor "cove-https"\n%s\npass all\n' "$RDR" | pfctl -ef - >/dev/null 2>&1
          echo "configured"
        fi
      register: pf_443
      changed_when: "'configured' in pf_443.stdout and 'already' not in pf_443.stdout"
      failed_when: false

    # DATA DIRECTORIES -------------------------------------------------------
    - name: Create cove data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ cove_data_root }}/forgejo/gitea"
        - "{{ cove_data_root }}/forgejo/git"
        - "{{ cove_data_root }}/forgejo/ssh"
        - "{{ cove_data_root }}/certs"
        - "{{ cove_data_root }}/vault/data"
        - "{{ cove_data_root }}/vault/logs"
        - "{{ cove_data_root }}/pages/sites"
        - "{{ cove_data_root }}/nginx"
        - "{{ cove_data_root }}/nginx/user.d"
        - "{{ cove_data_root }}/nginx/config/dns"
        - "{{ cove_data_root }}/dnsmasq"
        - "{{ cove_data_root }}/litellm"
        - "{{ cove_data_root }}/speedtest"
        - "{{ cove_data_root }}/ade"
        - "{{ cove_data_root }}/toolhive/config"
        - "{{ cove_data_root }}/toolhive/state"
        - "{{ cove_data_root }}/toolhive/profiles"

    - name: Create forgejo-runner data directory (restricted)
      ansible.builtin.file:
        path: "{{ cove_data_root }}/forgejo-runner"
        state: directory
        mode: "0700"

    - name: Create tunnel data directory (tunnel profile only)
      when: "'tunnel' in (cove_profiles | default(''))"
      ansible.builtin.file:
        path: "{{ cove_data_root }}/tunnel"
        state: directory
        mode: "0700"

    # TEMPLATES ----------------------------------------------------------------
    # Docker bind-mounts auto-create missing host paths as DIRECTORIES. If a
    # previous `docker compose up` ran before these files were rendered, the
    # mount targets below become empty dirs and every later `template` write
    # lands inside them, then nginx fails to start ("mount a directory onto a
    # file"). Guard: fail loudly if any mount target exists as a directory.
    - name: Assert nginx bind-mount targets are not directories
      ansible.builtin.stat:
        path: "{{ nginx_conf_dir }}/{{ item }}"
      loop:
        - default.conf
        - landing.html
        - pages.html
        - cove-config-locations.conf
        - cove-pages-locations.conf
        - cove-tunnel-shares.conf
      register: nginx_mount_targets
    - name: List contents of wedged nginx mount directories
      ansible.builtin.find:
        paths: "{{ item.stat.path }}"
        file_type: any
      loop: "{{ nginx_mount_targets.results }}"
      when: item.stat.isdir | default(false)
      register: nginx_wedged_scan
      loop_control:
        label: "{{ item.stat.path }}"
    - name: Remove empty Docker-created directories on nginx mount targets
      # Auto-repair: Docker created the dir, nothing was ever written into it,
      # so deleting it is safe. The template tasks below re-render the file.
      ansible.builtin.file:
        path: "{{ item.item.stat.path }}"
        state: absent
      loop: "{{ nginx_wedged_scan.results }}"
      when: item.files is defined and (item.files | length) == 0
      loop_control:
        label: "{{ item.item.stat.path }}"
    - name: Fail if a non-empty directory wedges an nginx mount
      ansible.builtin.fail:
        msg: >-
          {{ item.item.stat.path }} exists as a NON-EMPTY DIRECTORY where a
          file must be bind-mounted (Docker auto-created it and contents were
          written inside). Remove it and re-run: rm -rf {{ item.item.stat.path
          }} && cove up
      loop: "{{ nginx_wedged_scan.results }}"
      when: item.files is defined and (item.files | length) > 0
      loop_control:
        label: "{{ item.item.stat.path }}"

    - name: Render nginx config from template
      ansible.builtin.template:
        src: "{{ nginx_conf_dir }}/default.conf.j2"
        dest: "{{ nginx_conf_dir }}/default.conf"
        mode: "0644"
      notify: Reload nginx

    - name: Ensure cove-tunnel-shares.conf exists (empty state, never a directory)
      ansible.builtin.copy:
        dest: "{{ nginx_conf_dir }}/cove-tunnel-shares.conf"
        mode: "0644"
        content: |
          # Rendered by `cove tunnel` — public share routes (<name>.share.zrok.io).
          # State: COVE_TUNNEL_SHARES in the compose .env. Do not edit.
        force: false
      notify: Reload nginx
      when: not (nginx_conf_dir ~ "/cove-tunnel-shares.conf") is exists

    - name: Assert data-root bind-mount targets are not directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ cove_data_root }}/dnsmasq/cove.conf"
        - "{{ cove_data_root }}/nginx/config.html"
        - "{{ cove_data_root }}/litellm/config.yaml"
        - "{{ cove_data_root }}/toolhive/registry.json"
      register: data_mount_targets
    - name: List contents of wedged data-root mount directories
      ansible.builtin.find:
        paths: "{{ item.stat.path }}"
        file_type: any
      loop: "{{ data_mount_targets.results }}"
      when: item.stat.isdir | default(false)
      register: data_wedged_scan
      loop_control:
        label: "{{ item.stat.path }}"
    - name: Remove empty Docker-created directories on data-root mount targets
      # Auto-repair: Docker created the dir, nothing was ever written into it,
      # so deleting it is safe. The first-boot seeds and templates below
      # re-render the file (see the "repaired" force/when overrides).
      ansible.builtin.file:
        path: "{{ item.item.stat.path }}"
        state: absent
      loop: "{{ data_wedged_scan.results }}"
      when: item.files is defined and (item.files | length) == 0
      loop_control:
        label: "{{ item.item.stat.path }}"
    - name: Fail if a non-empty directory wedges a data-root mount
      ansible.builtin.fail:
        msg: >-
          {{ item.item.stat.path }} exists as a NON-EMPTY DIRECTORY where a
          file must be bind-mounted (Docker auto-created it and contents were
          written inside). Remove it and re-run: rm -rf {{ item.item.stat.path
          }} && cove up
      loop: "{{ data_wedged_scan.results }}"
      when: item.files is defined and (item.files | length) > 0
      loop_control:
        label: "{{ item.item.stat.path }}"
    - name: Track repaired data-root mount targets
      ansible.builtin.set_fact:
        repaired_data_mounts: >-
          {% set repaired = [] %}
          {% for scan in data_wedged_scan.results if scan.files is defined and (scan.files | length) == 0 %}
          {% set _ = repaired.append(scan.item.stat.path) %}
          {% endfor %}
          {{ repaired }}

    - name: Render litellm config from template (first boot only)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/litellm/config.yaml.j2"
        dest: "{{ cove_data_root }}/litellm/config.yaml"
        mode: "0644"
      when: >-
        (not (cove_data_root ~ "/litellm/config.yaml") is exists)
        or ((cove_data_root ~ "/litellm/config.yaml")
            in (repaired_data_mounts | default([])))

    # TOOLHIVE -----------------------------------------------------------------
    # IaC: the curated registry, the default permission profile, and the
    # ToolHive config (pointing the control plane at the local registry) are
    # seeded into ${COVE_DATA_ROOT}/toolhive/. First boot only — operator
    # edits to the deployed copies are preserved (litellm config pattern).
    # The control-plane container mounts registry.json and /profiles :ro.
    - name: Seed ToolHive curated registry (first boot only)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/toolhive/registry.json"
        dest: "{{ cove_data_root }}/toolhive/registry.json"
        mode: "0644"
        # Re-copy when the path was just auto-repaired (wedge removal),
        # otherwise first-boot only.
        force: "{{ (cove_data_root ~ '/toolhive/registry.json')
                   in (repaired_data_mounts | default([])) }}"

    - name: Seed ToolHive default permission profile (first boot only)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/toolhive/cove-default.json"
        dest: "{{ cove_data_root }}/toolhive/profiles/cove-default.json"
        mode: "0644"
        force: false

    - name: Render ToolHive config from template (first boot, or re-seed when overwritten)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/toolhive/config.yaml.j2"
        dest: "{{ cove_data_root }}/toolhive/config/toolhive/config.yaml"
        mode: "0644"
      vars:
        toolhive_config_path: "{{ cove_data_root ~ '/toolhive/config/toolhive/config.yaml' }}"
      # First boot only, plus a repair path: thv's own config persistence has
      # been observed to rewrite the seeded file (schema migration) and blank
      # local_registry_path, leaving the control plane without the curated
      # registry. Re-render only when the value is missing/blank so operator
      # edits stay preserved (litellm config pattern).
      when: >-
        (not (toolhive_config_path) is exists)
        or ((lookup('file', toolhive_config_path) | default('', true))
            | regex_search('local_registry_path:\\s*["\']?\\s*$', multiline=True) is not none)

    - name: Render dnsmasq config from template
      ansible.builtin.template:
        src: "{{ dnsmasq_conf_dir }}/cove.conf.j2"
        dest: "{{ cove_data_root }}/dnsmasq/cove.conf"
        mode: "0644"

    - name: Render nginx config info page
      ansible.builtin.template:
        src: "{{ nginx_conf_dir }}/config.html.j2"
        dest: "{{ cove_data_root }}/nginx/config.html"
        mode: "0644"

    - name: Render DNS config scripts
      ansible.builtin.template:
        src: "{{ nginx_conf_dir }}/config/dns/{{ item }}.j2"
        dest: "{{ cove_data_root }}/nginx/config/dns/{{ item }}"
        mode: "0644"
      loop:
        - macos
        - linux
        - windows
        - ios
        - android
        - unknown

    # COMPOSE .env -----------------------------------------------------------
    - name: Render compose .env (first boot only)
      ansible.builtin.copy:
        dest: "{{ compose_dir }}/.env"
        mode: "0600"
        content: |
          COVE_DATA_ROOT={{ cove_data_root }}
          FORGEJO_IMAGE={{ forgejo_image }}
          FORGEJO_CONTAINER_NAME={{ forgejo_container_name }}
          FORGEJO_DATA_ROOT={{ cove_data_root }}
          FORGEJO_UID={{ ansible_user_uid }}
          FORGEJO_GID={{ ansible_user_gid }}
          FORGEJO_DOMAIN=git.cove.local
          FORGEJO_ROOT_URL=https://git.cove.local/
          FORGEJO_SSH_DOMAIN=git.cove.local
          FORGEJO_SSH_PORT={{ forgejo_ssh_port }}
          FORGEJO_WEBHOOK_ALLOWED_HOST_LIST={{ forgejo_webhook_allowed_host_list | default('loopback') }}
          VAULT_IMAGE={{ vault_image }}
          VAULT_CONTAINER_NAME={{ vault_container_name }}
          NGINX_IMAGE={{ nginx_image }}
          NGINX_CONTAINER_NAME={{ nginx_container_name }}
          NGINX_CONF_DIR={{ nginx_conf_dir }}
          DNSMASQ_CONF_DIR={{ dnsmasq_conf_dir }}
          DNSMASQ_CONTAINER_NAME={{ dnsmasq_container_name }}
          DNSPROXY_CONTAINER_NAME={{ dnsproxy_container_name }}
          DNSMASQ_PORT={{ dnsmasq_port }}
          NGINX_HTTPS_PORT={{ nginx_https_port }}
          NGINX_HTTP_PORT={{ nginx_http_port }}
          LITELLM_IMAGE={{ litellm_image | default('cove-litellm:1.84.0') }}
          LITELLM_CONTAINER_NAME={{ litellm_container_name | default('cove-litellm') }}
          LITELLM_PORT={{ litellm_port | default('4000') }}
          HEADROOM_IMAGE={{ headroom_image | default('ghcr.io/chopratejas/headroom:latest@sha256:50b85d8e320cfcdf1b38919bb7ae067b93ff7a8de0a93f05b2c1246370200d1c') }}
          HEADROOM_CONTAINER_NAME={{ headroom_container_name | default('cove-headroom') }}
          HEADROOM_PORT={{ headroom_port | default('4001') }}
          SPEEDTEST_IMAGE={{ speedtest_image | default('lscr.io/linuxserver/speedtest-tracker:v1.14.5-ls162') }}
          SPEEDTEST_CONTAINER_NAME={{ speedtest_container_name | default('cove-speedtest-tracker') }}
          SPEEDTEST_PORT={{ speedtest_port | default('8982') }}
          SPEEDTEST_APP_KEY={{ speedtest_app_key | default('') }}
          TOOLHIVE_IMAGE={{ toolhive_image | default('ghcr.io/stacklok/toolhive:v0.51.4@sha256:5e1e253610db23188e3cab766949612f8b0c138627ec55fb754562a9610d4f9a') }}
          TOOLHIVE_CONTAINER_NAME={{ toolhive_container_name | default('cove-toolhive') }}
          TOOLHIVE_PORT={{ toolhive_port | default('8090') }}
          TOOLHIVE_MEM_LIMIT={{ toolhive_mem_limit | default('512M') }}
          FORGEJO_RUNNER_IMAGE={{ forgejo_runner_image | default('data.forgejo.org/forgejo/runner:11') }}
          FORGEJO_RUNNER_CONTAINER_NAME={{ forgejo_runner_container_name | default('cove-forgejo-runner') }}
          FORGEJO_RUNNER_MEM_LIMIT={{ forgejo_runner_mem_limit | default('512M') }}
          ADE_IMAGE={{ ade_image | default('cove-ade:' ~ (ade_bb_app_version | default('0.44.0'))) }}
          ADE_CONTAINER_NAME={{ ade_container_name | default('cove-ade-server') }}
          ADE_BB_APP_VERSION={{ ade_bb_app_version | default('0.44.0') }}
          ADE_PORT={{ ade_port | default('38886') }}
      when: not (compose_dir ~ "/.env") is exists

    # ADE_PORT/ADE_CONTAINER_NAME are the only knobs the container and
    # healthcheck read, while nginx is rendered from the Ansible var ade_port.
    # Re-sync the .env entries on every `cove up` (not just first boot) so a
    # changed ade_port cannot leave the container port ahead of the proxy.
    - name: Ensure ADE env matches the Ansible vars (port / container name)
      ansible.builtin.lineinfile:
        path: "{{ compose_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        mode: "0600"
      loop:
        - { key: "ADE_PORT", value: "{{ ade_port }}" }
        - { key: "ADE_CONTAINER_NAME", value: "{{ ade_container_name }}" }

    - name: Render tunnel env (tunnel profile only)
      when: "'tunnel' in (cove_profiles | default(''))"
      block:
        - name: Assert zrok2 account token is set
          ansible.builtin.assert:
            that:
              - zrok_account_token | default('') | length > 0
            fail_msg: >
              zrok_account_token is empty. Sign up at https://myzrok.io/ (no
              card required), store the account token via `cove creds`
              (op://Private/Zrok Account/account_token, ADR-017), and provide
              it through the tunnel profile vars. See docs/services/tunnel.md.

        - name: Ensure ZROK_ACCOUNT_TOKEN in compose .env
          ansible.builtin.lineinfile:
            path: "{{ compose_dir }}/.env"
            regexp: '^ZROK_ACCOUNT_TOKEN='
            line: "ZROK_ACCOUNT_TOKEN={{ zrok_account_token }}"
            mode: "0600"

        - name: Ensure ZROK_SHARE_NAME in compose .env
          when: zrok_share_name | default('') | length > 0
          ansible.builtin.lineinfile:
            path: "{{ compose_dir }}/.env"
            regexp: '^ZROK_SHARE_NAME='
            line: "ZROK_SHARE_NAME={{ zrok_share_name }}"

    # CONTAINERS -------------------------------------------------------------
    - name: Detect active docker context endpoint
      ansible.builtin.command: docker context inspect --format '{{ "{{" }} .Endpoints.docker.Host {{ "}}" }}'
      register: docker_host_detect
      changed_when: false

    - name: Bring up pod via docker compose
      ansible.builtin.shell: |
        docker compose \
        {{ '--project-name ' + compose_project_name if compose_project_name is defined else '' }} \
        --project-directory "{{ compose_dir }}" \
        up -d --pull "{{ pod_pull_policy }}"
      args:
        chdir: "{{ compose_dir }}"
      environment:
        DOCKER_HOST: "{{ docker_host_detect.stdout }}"
        COMPOSE_PROFILES: "{{ cove_profiles | default('') }}"
      changed_when: true

    - name: Wait for dnsmasq to respond
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ dnsmasq_port }}"
        timeout: 30

    - name: Wait for nginx ingress (hc.cove)
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ nginx_https_port }}/"
        headers:
          Host: hc.cove
        status_code: 200
        validate_certs: false
      register: hc_check
      retries: 10
      delay: 2
      until: hc_check.status == 200

    - name: Wait for Forgejo health endpoint
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ nginx_https_port }}/api/healthz"
        headers:
          Host: git.cove
        status_code: 200
        validate_certs: false
      register: forgejo_health
      retries: 30
      delay: 2
      until: forgejo_health.status == 200

    - name: Wait for Vault to respond
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ nginx_https_port }}/v1/sys/health"
        headers:
          Host: vault.cove
        status_code: [200, 429, 472, 473, 501, 503]
        validate_certs: false
      register: vault_health
      retries: 30
      delay: 2
      until: vault_health.status in [200, 429, 472, 473, 501, 503]

    - name: Print summary
      ansible.builtin.debug:
        msg: |
          Containers are up.
            Forgejo: https://git.cove.local/ (TLS via cove certs)
            Vault  : https://vault.cove.local/ (TLS via cove certs)
            SSH    : 0.0.0.0:{{ forgejo_ssh_port }}

          Bootstrap new devices: http://{{ ansible_default_ipv4.address }}:{{ nginx_http_port }}/config/
          {% if ts_status.rc == 0 %}or https://{{ ts_ip }}:{{ nginx_https_port }}/config/{% endif %}

          Next steps:
            1. ansible-playbook -i inventory.yml bootstrap_vault.yml
            2. ansible-playbook -i inventory.yml provision_vault_user.yml
            3. ansible-playbook -i inventory.yml provision_forgejo.yml

  handlers:
    - name: Reload nginx
      # macOS/Colima: file bind-mounts pin the host inode at container
      # creation, and the template/copy renders above are atomic (rename →
      # new inode). The running container's mount then serves a stale inode
      # (link-count 0, open() → ENOENT) and `nginx -s reload` — which must
      # re-open every config file — dies with "No such file or directory"
      # (2026-09-28 incident). A restart re-resolves the bind by path and
      # boots nginx on the fresh files; correct on Linux too (~1s blip).
      ansible.builtin.command: docker restart {{ nginx_container_name }}
      environment:
        DOCKER_HOST: "{{ docker_host_detect.stdout }}"
      changed_when: true
