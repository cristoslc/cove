- name: Bring up cove containers (forgejo + vault)
  hosts: localhost
  gather_facts: true
  vars:
    compose_dir: "{{ playbook_dir }}"

  tasks:
    - name: Set Forgejo URLs
      ansible.builtin.set_fact:
        cove_domain: cove
        forgejo_domain: git.cove
        forgejo_root_url: "https://git.cove/"
        forgejo_ssh_domain: git.cove

    - name: Ensure Colima is running (macOS)
      when: ansible_system == "Darwin"
      block:
        - name: Check if Colima is running
          ansible.builtin.command: colima status
          register: colima_check
          changed_when: false
          failed_when: false

        - name: Start Colima
          ansible.builtin.command: colima start
          when: colima_check.rc != 0
          changed_when: true

        - name: Switch Docker context to Colima
          ansible.builtin.command: docker context use colima
          changed_when: true

    - name: Check if tailscale is up
      ansible.builtin.command: tailscale status --json
      register: ts_status
      changed_when: false
      failed_when: false
      no_log: true

    - name: Get tailscale DNS name
      when: ts_status.rc == 0
      ansible.builtin.set_fact:
        ts_dns_name: "{{ (ts_status.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"

    - name: Get tailscale IP (fallback to LAN IP if Tailscale is down or has no IPs)
      ansible.builtin.set_fact:
        ts_ip: >-
          {{
            (ts_status.stdout | from_json).Self.TailscaleIPs[0]
            if (ts_status.rc == 0 and (ts_status.stdout | from_json).Self.TailscaleIPs | length > 0)
            else ansible_default_ipv4.address
          }}

    - name: Configure tailscale serve for HTTPS on port 443
      when: ts_status.rc == 0
      ansible.builtin.shell: |
        set -eo pipefail
        JSON=$(tailscale serve status --json 2>/dev/null || echo '{}')
        if echo "$JSON" | python3 -c "import json,sys; s=json.load(sys.stdin); exit(0 if s.get('Web',{}).get('443') else 1)"; then
          echo "already configured"
        else
          tailscale serve --bg --https "443" https://127.0.0.1:8443
          echo "configured"
        fi
      register: ts_serve_https
      changed_when: "'configured' in ts_serve_https.stdout and 'already' not in ts_serve_https.stdout"

    - name: Ensure mkcert is available
      ansible.builtin.command: which mkcert
      register: mkcert_check
      changed_when: false
      failed_when: false

    - name: Install mkcert CA
      ansible.builtin.command: mkcert -install
      when: mkcert_check.rc == 0
      changed_when: false

    - name: Detect mkcert CAROOT path
      ansible.builtin.command: mkcert -CAROOT
      register: mkcert_caroot
      changed_when: false
      failed_when: false

    - name: Set MKCERT_CAROOT fact
      when: mkcert_caroot.rc == 0
      ansible.builtin.set_fact:
        mkcert_caroot_path: "{{ mkcert_caroot.stdout }}"

    - name: Read root CA certificate
      when: mkcert_caroot.rc == 0
      ansible.builtin.slurp:
        src: "{{ mkcert_caroot_path }}/rootCA.pem"
      register: root_ca_slurp

    # Apple .mobileconfig profiles require the certificate as raw base64-encoded
    # DER, not PEM-wrapped. Strip the BEGIN/END CERTIFICATE headers and all
    # newlines to produce a single-line base64 string suitable for the
    # <data> element in the iOS configuration profile payload.
    - name: Base64-encode root CA (strip PEM headers for .mobileconfig)
      when: mkcert_caroot.rc == 0
      ansible.builtin.set_fact:
        root_ca_b64: "{{ (root_ca_slurp.content | b64decode | regex_replace('-----BEGIN CERTIFICATE-----\\n?', '') | regex_replace('-----END CERTIFICATE-----\\n?', '') | regex_replace('\\n', '') | trim) }}"

    # Generate UUIDs for the iOS .mobileconfig profile.
    # Apple requires a unique PayloadUUID for each payload entry
    # and for the top-level Configuration profile itself.
    #   ca_uuid      — identifies the root CA certificate payload
    #   dns_uuid     — identifies the DNS settings payload
    #   profile_uuid — identifies the top-level configuration profile
    - name: Generate UUIDs for iOS profile
      ansible.builtin.shell: python3 -c "import uuid; print(uuid.uuid4()); print(uuid.uuid4()); print(uuid.uuid4())"
      register: uuids
      changed_when: false

    - name: Set UUID facts
      ansible.builtin.set_fact:
        ca_uuid: "{{ uuids.stdout_lines[0] }}"
        dns_uuid: "{{ uuids.stdout_lines[1] }}"
        profile_uuid: "{{ uuids.stdout_lines[2] }}"

    - name: Generate mkcert cert for *.cove + per-machine wildcard
      ansible.builtin.command:
        argv:
          - mkcert
          - -key-file
          - "{{ cove_data_root }}/certs/cove.local-key.pem"
          - -cert-file
          - "{{ cove_data_root }}/certs/cove.local.pem"
          - "*.cove"
          - "*.cove.{{ ansible_hostname }}"
          - cove
          - git.cove
          - vault.cove
          - hc.cove
          - ca.cove
          - "*.pages.cove"
          - localhost
          - 127.0.0.1
          - "::1"
      args:
        creates: "{{ cove_data_root }}/certs/cove.local.pem"
      when: mkcert_check.rc == 0

    - name: Validate TLS cert covers required hostnames
      ansible.builtin.shell: |
        set -eo pipefail
        CERT="{{ cove_data_root }}/certs/cove.local.pem"
        for host in "git.cove" "vault.cove" "hc.cove" "ca.cove" "*.cove" "*.cove.{{ ansible_hostname }}"; do
          if ! openssl x509 -in "$CERT" -text -noout | grep -q "DNS:$host"; then
            echo "MISSING: $host"
            exit 1
          fi
        done
        echo "OK"
      register: cert_check
      changed_when: false

    - name: Add *.cove hostnames to /etc/hosts
      become: true
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.0\.1\s+.*cove(\s|$)'
        line: "127.0.0.1 cove git.cove vault.cove hc.cove ca.cove"
        state: present
      failed_when: false

    - name: Forward localhost:443 → localhost:8443 via pf
      become: true
      when: ansible_system == "Darwin"
      ansible.builtin.shell: |
        set -eo pipefail
        if pfctl -s nat 2>/dev/null | grep -q '8443'; then
          echo "already configured"
        else
          RDR='rdr pass on lo0 inet proto tcp from any to 127.0.0.1 port 443 -> 127.0.0.1 port 8443'
          printf 'rdr-anchor "cove-https"\n%s\npass all\n' "$RDR" | pfctl -ef - >/dev/null 2>&1
          echo "configured"
        fi
      register: pf_443
      changed_when: "'configured' in pf_443.stdout and 'already' not in pf_443.stdout"
      failed_when: false

    # DATA DIRECTORIES -------------------------------------------------------
    - name: Create cove data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ cove_data_root }}/forgejo/gitea"
        - "{{ cove_data_root }}/forgejo/git"
        - "{{ cove_data_root }}/forgejo/ssh"
        - "{{ cove_data_root }}/certs"
        - "{{ cove_data_root }}/vault/data"
        - "{{ cove_data_root }}/vault/logs"
        - "{{ cove_data_root }}/pages/sites"
        - "{{ cove_data_root }}/nginx"
        - "{{ cove_data_root }}/nginx/user.d"
        - "{{ cove_data_root }}/nginx/config/dns"
        - "{{ cove_data_root }}/dnsmasq"

    # TEMPLATES ----------------------------------------------------------------
    - name: Render nginx config from template
      ansible.builtin.template:
        src: "{{ nginx_conf_dir }}/default.conf.j2"
        dest: "{{ nginx_conf_dir }}/default.conf"
        mode: "0644"

    - name: Render dnsmasq config from template
      ansible.builtin.template:
        src: "{{ dnsmasq_conf_dir }}/cove.conf.j2"
        dest: "{{ cove_data_root }}/dnsmasq/cove.conf"
        mode: "0644"

    - name: Render nginx config info page
      ansible.builtin.template:
        src: "{{ nginx_conf_dir }}/config.html.j2"
        dest: "{{ cove_data_root }}/nginx/config.html"
        mode: "0644"

    - name: Render DNS config scripts
      ansible.builtin.template:
        src: "{{ nginx_conf_dir }}/config/dns/{{ item }}.j2"
        dest: "{{ cove_data_root }}/nginx/config/dns/{{ item }}"
        mode: "0644"
      loop:
        - macos
        - linux
        - windows
        - ios
        - android
        - unknown

    # COMPOSE .env -----------------------------------------------------------
    - name: Render compose .env
      ansible.builtin.copy:
        dest: "{{ compose_dir }}/.env"
        mode: "0600"
        content: |
          COVE_DATA_ROOT={{ cove_data_root }}
          FORGEJO_IMAGE={{ forgejo_image }}
          FORGEJO_CONTAINER_NAME={{ forgejo_container_name }}
          FORGEJO_DATA_ROOT={{ cove_data_root }}
          FORGEJO_UID={{ ansible_user_uid }}
          FORGEJO_GID={{ ansible_user_gid }}
          FORGEJO_DOMAIN=git.cove
          FORGEJO_ROOT_URL=https://git.cove/
          FORGEJO_SSH_DOMAIN=git.cove
          FORGEJO_SSH_PORT={{ forgejo_ssh_port }}
          VAULT_IMAGE={{ vault_image }}
          VAULT_CONTAINER_NAME={{ vault_container_name }}
          NGINX_IMAGE={{ nginx_image }}
          NGINX_CONTAINER_NAME={{ nginx_container_name }}
          NGINX_CONF_DIR={{ nginx_conf_dir }}
          DNSMASQ_CONF_DIR={{ dnsmasq_conf_dir }}
          DNSMASQ_CONTAINER_NAME={{ dnsmasq_container_name }}
          DNSMASQ_PORT={{ dnsmasq_port }}
          MKCERT_CAROOT={{ mkcert_caroot_path }}

    # CONTAINERS -------------------------------------------------------------
    - name: Detect active docker context endpoint
      ansible.builtin.command: docker context inspect --format '{{ "{{" }} .Endpoints.docker.Host {{ "}}" }}'
      register: docker_host_detect
      changed_when: false

    - name: Bring up pod via docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: present
        pull: "{{ pod_pull_policy }}"
        wait: false
        recreate: always
        docker_host: "{{ docker_host_detect.stdout }}"

    - name: Wait for dnsmasq to respond
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ dnsmasq_port }}"
        timeout: 30

    - name: Wait for nginx ingress (hc.cove)
      ansible.builtin.uri:
        url: "https://hc.cove/"
        status_code: 200
        validate_certs: false
      register: hc_check
      retries: 10
      delay: 2
      until: hc_check.status == 200

    - name: Wait for Forgejo health endpoint
      ansible.builtin.uri:
        url: "https://git.cove/api/healthz"
        status_code: 200
        validate_certs: false
      register: forgejo_health
      retries: 30
      delay: 2
      until: forgejo_health.status == 200

    - name: Wait for Vault to respond
      ansible.builtin.uri:
        url: "https://vault.cove/v1/sys/health"
        status_code: [200, 429, 472, 473, 501, 503]
        validate_certs: false
      register: vault_health
      retries: 30
      delay: 2
      until: vault_health.status in [200, 429, 472, 473, 501, 503]

    - name: Print summary
      ansible.builtin.debug:
        msg: |
          Containers are up.
            Forgejo: https://git.cove/ (TLS via nginx+mkcert)
            Vault  : https://vault.cove/ (TLS via nginx+mkcert)
            SSH    : 0.0.0.0:{{ forgejo_ssh_port }}

          Bootstrap new devices: http://{{ ansible_default_ipv4.address }}:8080/config/
          {% if ts_status.rc == 0 %}or https://{{ ts_ip }}:8443/config/{% endif %}

          Next steps:
            1. ansible-playbook -i inventory.yml bootstrap_vault.yml
            2. ansible-playbook -i inventory.yml provision_vault_user.yml
            3. ansible-playbook -i inventory.yml provision_forgejo.yml
