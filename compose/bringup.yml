- name: Bring up cove containers (forgejo + vault)
  hosts: localhost
  gather_facts: true
  vars:
    compose_dir: "{{ playbook_dir }}"

  tasks:
    - name: Set Forgejo URLs for cove.local
      ansible.builtin.set_fact:
        forgejo_domain: "git.cove.{{ cove_domain }}"
        forgejo_root_url: "https://git.cove.{{ cove_domain }}/"
        forgejo_ssh_domain: "{{ cove_domain }}"

    - name: Check if mkcert is installed
      ansible.builtin.command: which mkcert
      register: mkcert_check
      changed_when: false
      failed_when: false

    - name: Install mkcert via Homebrew
      community.general.homebrew:
        name: mkcert
        state: present
      when: mkcert_check.rc != 0

    - name: Install mkcert local CA
      ansible.builtin.command: mkcert -install
      become: true
      register: mkcert_install
      changed_when: "'created' in mkcert_install.stdout | default('')"

    - name: Generate wildcard TLS certificate
      ansible.builtin.command: >
        mkcert
        -key-file "{{ cert_dir }}/privkey.pem"
        -cert-file "{{ cert_dir }}/fullchain.pem"
        "*.{{ cove_domain }}"
        "git.{{ cove_domain }}"
      args:
        chdir: "{{ cert_dir }}"
        creates: "{{ cert_dir }}/fullchain.pem"

    - name: Check if tailscale is up
      ansible.builtin.command: tailscale status --json
      register: ts_status
      changed_when: false
      failed_when: false
      no_log: true

    - name: Set up tailscale serve (optional overlay)
      when: ts_status.rc == 0
      block:
        - name: Get tailscale DNS name
          ansible.builtin.set_fact:
            ts_dns_name: "{{ (ts_status.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"

        - name: Configure tailscale serve for HTTPS on port 443
          ansible.builtin.shell: |
            set -eo pipefail
            JSON=$(tailscale serve status --json 2>/dev/null || echo '{}')
            if echo "$JSON" | python3 -c "import json,sys; s=json.load(sys.stdin); exit(0 if s.get('Web',{}).get('443') else 1)"; then
              echo "already configured"
            else
              tailscale serve --bg --https "443" "https://127.0.0.1:8443"
              echo "configured"
            fi
          register: ts_serve_https
          changed_when: "'configured' in ts_serve_https.stdout and 'already' not in ts_serve_https.stdout"

    - name: Create macOS resolver for cove.local
      become: true
      ignore_errors: true
      ansible.builtin.copy:
        dest: /etc/resolver/cove.local
        content: |
          nameserver 127.0.0.1
          port 5353
        mode: "0644"

    # DATA DIRECTORIES -------------------------------------------------------
    - name: Create cove data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ cove_data_root }}/forgejo/gitea"
        - "{{ cove_data_root }}/forgejo/git"
        - "{{ cove_data_root }}/forgejo/ssh"
        - "{{ cove_data_root }}/certs"
        - "{{ cove_data_root }}/vault/data"
        - "{{ cove_data_root }}/vault/logs"
        - "{{ cove_data_root }}/pages/sites"
        - "{{ cove_data_root }}/nginx"

    # TEMPLATES ----------------------------------------------------------------
    - name: Render nginx config from template
      ansible.builtin.template:
        src: "{{ nginx_conf_dir }}/default.conf.j2"
        dest: "{{ nginx_conf_dir }}/default.conf"
        mode: "0644"

    - name: Ensure dnsmasq data directory exists
      ansible.builtin.file:
        path: "{{ cove_data_root }}/dnsmasq"
        state: directory
        mode: "0755"

    - name: Render dnsmasq config from template
      ansible.builtin.template:
        src: "{{ dnsmasq_conf_dir }}/cove.conf.j2"
        dest: "{{ cove_data_root }}/dnsmasq/cove.conf"
        mode: "0644"

    # COMPOSE .env -----------------------------------------------------------
    - name: Render compose .env from host vars
      ansible.builtin.copy:
        dest: "{{ compose_dir }}/.env"
        mode: "0600"
        content: |
          COVE_DATA_ROOT={{ cove_data_root }}
          FORGEJO_IMAGE={{ forgejo_image }}
          FORGEJO_CONTAINER_NAME={{ forgejo_container_name }}
          FORGEJO_DATA_ROOT={{ cove_data_root }}
          FORGEJO_UID={{ ansible_user_uid }}
          FORGEJO_GID={{ ansible_user_gid }}
          FORGEJO_DOMAIN={{ forgejo_domain }}
          FORGEJO_ROOT_URL={{ forgejo_root_url }}
          FORGEJO_SSH_DOMAIN={{ forgejo_ssh_domain }}
          FORGEJO_SSH_PORT={{ forgejo_ssh_port }}
          FORGEJO_HTTP_BIND={{ forgejo_http_bind }}
          FORGEJO_HTTP_PORT={{ forgejo_http_port }}
          FORGEJO_SSH_BIND={{ forgejo_ssh_bind }}
          VAULT_IMAGE={{ vault_image }}
          VAULT_CONTAINER_NAME={{ vault_container_name }}
          VAULT_BIND={{ vault_bind }}
          VAULT_PORT={{ vault_port }}
          NGINX_IMAGE={{ nginx_image }}
          NGINX_CONTAINER_NAME={{ nginx_container_name }}
          NGINX_CONF_DIR={{ nginx_conf_dir }}
          NGINX_HTTP_BIND={{ nginx_http_bind }}
          NGINX_HTTP_PORT={{ nginx_http_port }}
          NGINX_HTTPS_PORT={{ nginx_https_port }}
          COVE_FQDN={{ cove_domain }}
          DNSMASQ_CONF_DIR={{ dnsmasq_conf_dir }}
          DNSMASQ_CONTAINER_NAME={{ dnsmasq_container_name }}
          DNSMASQ_BIND={{ dnsmasq_bind }}
          DNSMASQ_PORT={{ dnsmasq_port }}

    # CONTAINERS -------------------------------------------------------------
    - name: Detect active docker context endpoint
      ansible.builtin.command: docker context inspect --format '{{ "{{" }} .Endpoints.docker.Host {{ "}}" }}'
      register: docker_host_detect
      changed_when: false

    - name: Bring up pod via docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: present
        pull: "{{ pod_pull_policy }}"
        wait: false
        recreate: always
        docker_host: "{{ docker_host_detect.stdout }}"

    - name: Wait for Forgejo health endpoint
      ansible.builtin.uri:
        url: "{{ forgejo_root_url }}api/healthz"
        status_code: 200
        validate_certs: false
      register: forgejo_health
      retries: 30
      delay: 2
      until: forgejo_health.status == 200

    - name: Wait for nginx to respond
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nginx_http_port }}"
        status_code: [200, 301, 302, 404]
      register: nginx_health
      retries: 20
      delay: 2
      until: nginx_health.status in [200, 301, 302, 404]

    - name: Wait for Vault to respond
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/health"
        status_code: [200, 429, 472, 473, 501, 503]
      register: vault_health
      retries: 30
      delay: 2
      until: vault_health.status in [200, 429, 472, 473, 501, 503]

    - name: Print summary
      ansible.builtin.debug:
        msg: |
          Containers are up.
            Nginx  : https://127.0.0.1:{{ nginx_https_port }} (reverse proxy)
                     ├─ git.cove.{{ cove_domain }} → forgejo:3000
                     └─ *.pages.cove.{{ cove_domain }} → /data/pages/sites/
            Forgejo: {{ forgejo_root_url }} (behind nginx)
            SSH    : {{ forgejo_ssh_bind }}:{{ forgejo_ssh_port }}
            DNS    : dnsmasq on {{ dnsmasq_bind }}:{{ dnsmasq_port }} (wildcard *.cove.{{ cove_domain }})
            TLS    : mkcert wildcard cert for *.cove.{{ cove_domain }}
            {% if ts_status.rc == 0 %}Tailscale: {{ ts_dns_name | default('(detected)') }} (serve → 443 → nginx:8443)
            {% endif %}Vault  : {{ vault_addr }} (initialized={{ vault_health.json.initialized | default(false) }}, sealed={{ vault_health.json.sealed | default(true) }})

          Next steps:
            1. ansible-playbook -i inventory.yml bootstrap_vault.yml
            2. ansible-playbook -i inventory.yml provision_vault_user.yml
            3. ansible-playbook -i inventory.yml provision_forgejo.yml
            4. ansible-playbook -i inventory.yml provision_pages.yml
