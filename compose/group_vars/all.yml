---
cove_data_root: "{{ ansible_env.HOME }}/Documents/cove-data"

# --- Forgejo ---
forgejo_image_tag: "15"
forgejo_image_digest: ""
forgejo_image: "codeberg.org/forgejo/forgejo:{{ forgejo_image_tag }}"
forgejo_container_name: cove-forgejo
forgejo_http_port: 3000
forgejo_ssh_port: 2222
forgejo_domain: git.cove
forgejo_root_url: "https://git.cove/"
forgejo_ssh_domain: git.cove

# --- Vault ---
vault_image_tag: "1.20"
vault_image_digest: "sha256:268bb80aa9c6d13d65fcfa05c0c268caca068952240a8087291a6ce0b66e3a10"
vault_image: "hashicorp/vault:{{ vault_image_tag }}@{{ vault_image_digest }}"
vault_container_name: cove-vault
vault_port: 8200
vault_addr: "https://vault.cove"
vault_key_shares: 5
vault_key_threshold: 3
vault_keystore_prefix: "cove/vault"

# --- 1Password ---
op_vault: "Private"
forgejo_admin_op_ref: "op://{{ op_vault }}/Forgejo {{ ansible_hostname }} Admin/password"
vault_user_op_ref: "op://{{ op_vault }}/Vault {{ ansible_hostname }} {{ admin_username }}/password"
vault_ui_username: "{{ admin_username }}"
vault_ui_policy_name: admins

# --- Admin + repo ---
admin_username: cristos
admin_email: "lc.cristos@gmail.com"
repo_owner: "{{ admin_username }}"
repo_name: "cove"

pod_pull_policy: missing

# --- Tailscale ---
# Overridden at runtime by bringup.yml when tailscale is active.
ts_dns_name: "localhost"

# --- Pages ---
pages_data_root: "{{ cove_data_root }}/pages"

# --- nginx ---
nginx_image: "nginx:1.27-alpine"
nginx_container_name: cove-nginx
nginx_conf_dir: "{{ playbook_dir }}/nginx"
nginx_http_port: 8080
nginx_https_port: 8443

# --- dnsmasq ---
dnsmasq_conf_dir: "{{ playbook_dir }}/dnsmasq"
dnsmasq_container_name: cove-dnsmasq
dnsmasq_port: 5353

# --- OpenCode ---
opencode_image: "ghcr.io/anomalyco/opencode:latest"
opencode_container_name: cove-opencode
opencode_code_dir: "{{ ansible_env.HOME }}/Documents/code"
opencode_projects_dir: "{{ ansible_env.HOME }}/Documents/projects"
opencode_data_dir: "{{ ansible_env.HOME }}/Documents/cove/opencode"
opencode_config_dir: "{{ ansible_env.HOME }}/.config/opencode"
opencode_server_username: opencode
opencode_server_port: 4095
opencode_caddy_port: 4097
opencode_1p_ref: "op://{{ op_vault }}/OpenCode Server"

# --- Caddy ---
caddy_conf_dir: "{{ playbook_dir }}/caddy"
caddy_container_name: cove-caddy
