- name: Set up Forgejo admin and SSH key
  hosts: localhost
  gather_facts: true
  vars:
    computer_name: "{{ ansible_hostname | regex_replace('\\..*$', '') }}"
    ssh_key_path: "{{ ansible_env.HOME }}/.ssh/forgejo_{{ computer_name | lower }}_ed25519"
    cli_dir: "{{ playbook_dir }}/../cli"

  tasks:
    - name: Check Vault seal status
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/health"
        status_code: [200, 429, 501, 503]
        validate_certs: false
      register: vault_health

    - name: Fail if Vault sealed
      ansible.builtin.fail:
        msg: |
          Vault is sealed. Unseal first:
            cd {{ playbook_dir }} && ansible-playbook -i inventory.yml bootstrap_vault.yml
      when: vault_health.json.sealed | default(true)

    - name: Check if tailscale is up
      ansible.builtin.command: tailscale status --json
      register: ts_status_prov
      changed_when: false
      failed_when: false
      no_log: true

    - name: Get tailscale DNS name
      when: ts_status_prov.rc == 0
      ansible.builtin.set_fact:
        ts_dns_name_prov: "{{ (ts_status_prov.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"

    - name: Check 1P forgejo admin item cached
      ansible.builtin.command:
        argv:
          - uv
          - run
          - --directory
          - "{{ cli_dir }}"
          - cove
          - creds
          - vault-get
          - "{{ forgejo_admin_op_ref }}"
      register: pwd_check
      changed_when: false
      failed_when: false

    - name: Seed 1P with Forgejo creds (renders + executes bulk-write)
      ansible.builtin.command:
        argv:
          - uv
          - run
          - --directory
          - "{{ cli_dir }}"
          - cove
          - creds
          - 1p-bulk-write
          - "{{ playbook_dir }}/../seeds/forgejo-creds.yaml"
          - --execute
      when: pwd_check.rc != 0

    - name: Cache admin password in Vault (no-op if already cached)
      ansible.builtin.command:
        argv:
          - uv
          - run
          - --directory
          - "{{ cli_dir }}"
          - cove
          - creds
          - vault-put
          - "{{ forgejo_admin_op_ref }}"
      register: admin_pw_resolve
      changed_when: false
      no_log: true

    - name: Set admin password fact
      ansible.builtin.set_fact:
        admin_password: "{{ admin_pw_resolve.stdout }}"
      no_log: true

    - name: Check whether SSH key already exists on disk
      ansible.builtin.stat:
        path: "{{ ssh_key_path }}"
      register: ssh_key_stat

    - name: Generate dedicated ed25519 SSH key
      ansible.builtin.command: >
        ssh-keygen -t ed25519 -f {{ ssh_key_path }} -N "" -C "forgejo-{{ computer_name | lower }}"
      when: not ssh_key_stat.stat.exists

    - name: Lock down private key permissions
      ansible.builtin.file:
        path: "{{ ssh_key_path }}"
        mode: "0600"

    - name: Read SSH public key
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}.pub"
      register: ssh_pub

    - name: Detect whether Forgejo is in install mode
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ forgejo_container_name }}"
          - test
          - -f
          - /data/gitea/conf/app.ini
      register: app_ini_check
      changed_when: false
      failed_when: false

    - name: Complete Forgejo install
      ansible.builtin.uri:
        url: "{{ forgejo_root_url }}"
        method: POST
        body_format: form-urlencoded
        validate_certs: false
        body:
          db_type: sqlite3
          db_path: /data/gitea/gitea.db
          app_name: Forgejo
          repo_root_path: /data/git/repositories
          lfs_root_path: /data/gitea/lfs
          run_user: git
          domain: "{{ forgejo_domain }}"
          ssh_port: "22"
          http_port: "3000"
          app_url: "{{ forgejo_root_url }}"
          log_root_path: /data/gitea/log
          admin_name: "{{ admin_username }}"
          admin_email: "{{ admin_email }}"
          admin_passwd: "{{ admin_password }}"
          admin_confirm_passwd: "{{ admin_password }}"
          no_reply_address: "noreply.{{ forgejo_domain }}"
        status_code: [200, 302]
      when: app_ini_check.rc != 0
      no_log: true

    - name: Wait for Forgejo to come back post-install
      ansible.builtin.uri:
        url: "{{ forgejo_root_url }}api/v1/version"
        status_code: [200, 403]
        validate_certs: false
      register: post_install_version
      retries: 30
      delay: 2
      until: post_install_version.status in [200, 403]

    - name: Generate provisioning API token (unique name avoids collisions)
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - git
          - "{{ forgejo_container_name }}"
          - forgejo
          - --config
          - /data/gitea/conf/app.ini
          - admin
          - user
          - generate-access-token
          - --username
          - "{{ admin_username }}"
          - --token-name
          - "cove-provision-{{ ansible_date_time.epoch }}"
          - --scopes
          - "write:user,write:repository,write:admin"
          - --raw
      register: token_out
      changed_when: true
      no_log: true

    - name: Extract API token
      ansible.builtin.set_fact:
        api_token: "{{ token_out.stdout | trim }}"
      no_log: true

    - name: Generate persistent cove-push token (for git HTTPS pushes)
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - git
          - "{{ forgejo_container_name }}"
          - forgejo
          - --config
          - /data/gitea/conf/app.ini
          - admin
          - user
          - generate-access-token
          - --username
          - "{{ admin_username }}"
          - --token-name
          - "cove-push"
          - --scopes
          - "write:repository,write:issue"
          - --raw
      register: push_token_out
      changed_when: push_token_out.rc == 0
      failed_when: false
      no_log: true

    - name: Store HTTP credentials for Forgejo remote (fjl)
      ansible.builtin.command:
        stdin: |
          protocol=https
          host={{ forgejo_domain }}:{{ forgejo_http_port }}
          username={{ admin_username }}
          password={{ push_token_out.stdout | trim }}
      args:
        argv:
          - git
          - credential
          - approve
      when: push_token_out.rc == 0
      changed_when: true
      no_log: true

    - name: Check whether repo exists
      ansible.builtin.uri:
        url: "{{ forgejo_root_url }}api/v1/repos/{{ repo_owner }}/{{ repo_name }}"
        headers:
          Authorization: "token {{ api_token }}"
        validate_certs: false
        status_code: [200, 404]
      register: repo_check
      no_log: true

    - name: Create empty repo
      ansible.builtin.uri:
        url: "{{ forgejo_root_url }}api/v1/user/repos"
        method: POST
        headers:
          Authorization: "token {{ api_token }}"
          Content-Type: application/json
        validate_certs: false
        body_format: json
        body:
          name: "{{ repo_name }}"
          description: "Cove deployment and configuration"
          private: true
          auto_init: false
          default_branch: main
        status_code: 201
      when: repo_check.status == 404
      no_log: true

    - name: Enable autodetect manual merge on repo
      ansible.builtin.uri:
        url: "{{ forgejo_root_url }}api/v1/repos/{{ repo_owner }}/{{ repo_name }}"
        method: PATCH
        headers:
          Authorization: "token {{ api_token }}"
          Content-Type: application/json
        validate_certs: false
        body_format: json
        body:
          autodetect_manual_merge: true
        status_code: 200
      no_log: true

    - name: List existing SSH keys on Forgejo user
      ansible.builtin.uri:
        url: "{{ forgejo_root_url }}api/v1/user/keys"
        headers:
          Authorization: "token {{ api_token }}"
        validate_certs: false
        return_content: true
      register: keys_resp
      no_log: true

    - name: Register SSH public key on Forgejo
      ansible.builtin.uri:
        url: "{{ forgejo_root_url }}api/v1/user/keys"
        method: POST
        headers:
          Authorization: "token {{ api_token }}"
          Content-Type: application/json
        validate_certs: false
        body_format: json
        body:
          title: "forgejo-{{ computer_name | lower }}"
          key: "{{ ssh_pub.content | b64decode | trim }}"
        status_code: 201
      when: keys_resp.json | selectattr('title', 'equalto', 'forgejo-' + (computer_name | lower)) | list | length == 0
      no_log: true

    - name: Add localhost host key
      ansible.builtin.shell: |
        set -euo pipefail
        PORT="{{ forgejo_ssh_port }}"
        ssh-keygen -R '[127.0.0.1]:'"$PORT" >/dev/null 2>&1 || true
        ssh-keygen -R '[localhost]:'"$PORT" >/dev/null 2>&1 || true
        KEY=$(ssh-keyscan -p "$PORT" -t ed25519 127.0.0.1 2>/dev/null | grep -v '^#' | head -1)
        if [ -z "$KEY" ]; then
          echo "ssh-keyscan returned no host key for 127.0.0.1:$PORT" >&2
          exit 1
        fi
        printf '%s\n' "$KEY" >> {{ ansible_env.HOME }}/.ssh/known_hosts
        printf '%s\n' "$KEY" | sed 's/^\[127\.0\.0\.1\]:/[localhost]:/' >> {{ ansible_env.HOME }}/.ssh/known_hosts
      changed_when: true

    - name: Add tailscale SSH host key
      ansible.builtin.shell: |
        set -euo pipefail
        PORT="{{ forgejo_ssh_port }}"
        DNS="{{ ts_dns_name_prov }}"
        ssh-keygen -R '['"$DNS"']:'"$PORT" >/dev/null 2>&1 || true
        KEY=$(ssh-keyscan -p "$PORT" -t ed25519 127.0.0.1 2>/dev/null | grep -v '^#' | head -1)
        if [ -z "$KEY" ]; then
          echo "ssh-keyscan returned no host key for 127.0.0.1:$PORT" >&2
          exit 1
        fi
        printf '%s\n' "$KEY" | sed 's/^\[127\.0\.0\.1\]:/['"$DNS"']:/' >> {{ ansible_env.HOME }}/.ssh/known_hosts
      changed_when: true
      when: ts_status_prov.rc == 0

    - name: Ensure ~/.ssh/config.d exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.ssh/config.d"
        state: directory
        mode: "0700"

    - name: Write forgejo-localhost SSH config
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.ssh/config.d/forgejo-localhost.conf"
        mode: "0600"
        content: |
          # Forgejo (localhost:2222) — uses a file-based key, not the 1Password agent.
          # IdentitiesOnly + explicit IdentityFile bypass the global 1Password IdentityAgent.
          Host forgejo-localhost
            HostName localhost
            Port {{ forgejo_ssh_port }}
            User git
            IdentityFile {{ ssh_key_path }}
            IdentityAgent none
            IdentitiesOnly yes

    - name: Ensure ~/.ssh/config includes config.d
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.ssh/config"
        line: "Include config.d/*"
        create: true
        mode: "0600"

    - name: Print ready summary
      ansible.builtin.debug:
        msg: |
          Forgejo provisioned.
            Admin: {{ admin_username }} (password sourced from Vault cache via {{ forgejo_admin_op_ref }})
            Repo URL: {{ forgejo_root_url }}{{ repo_owner }}/{{ repo_name }}

          To add as remote and push:
            git remote add cove {{ forgejo_root_url }}{{ repo_owner }}/{{ repo_name }}
            git push -u cove main
