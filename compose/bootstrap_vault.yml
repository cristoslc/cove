- name: Bootstrap local Vault and store unseal keys in OS keystore
  hosts: localhost
  gather_facts: true
  vars:
    compose_dir: "{{ playbook_dir }}"
    keystore_account: "{{ ansible_user_id }}"

  tasks:
    - name: Verify OS keystore CLI is present
      ansible.builtin.include_role:
        name: os_keystore
        tasks_from: preflight

    - name: Create Vault data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ cove_data_root | default(ansible_env.HOME + '/Documents/cove-data') }}/vault/data"
        - "{{ cove_data_root | default(ansible_env.HOME + '/Documents/cove-data') }}/vault/logs"

    - name: Ensure compose .env exists (run bringup.yml first if missing)
      ansible.builtin.stat:
        path: "{{ compose_dir }}/.env"
      register: env_stat

    - name: Fail if .env not yet rendered
      ansible.builtin.fail:
        msg: |
          {{ compose_dir }}/.env is missing. Run bringup.yml first to render it,
          or render manually before bootstrapping Vault.
      when: not env_stat.stat.exists

    - name: Detect active docker context endpoint
      ansible.builtin.command: docker context inspect --format '{{ "{{" }} .Endpoints.docker.Host {{ "}}" }}'
      register: docker_host_detect
      changed_when: false

    - name: Bring up Vault container
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        services: [vault]
        state: present
        pull: "{{ pod_pull_policy }}"
        wait: false
        docker_host: "{{ docker_host_detect.stdout }}"

    - name: Wait for Vault to respond on /v1/sys/health
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/health"
        # 200=initialized+unsealed+active, 429=unsealed-standby, 501=not-initialized, 503=sealed
        status_code: [200, 429, 501, 503]
      register: health
      retries: 30
      delay: 2
      until: health.status in [200, 429, 501, 503]

    - name: Determine Vault initialization state
      ansible.builtin.set_fact:
        vault_initialized: "{{ health.json.initialized | default(false) }}"
        vault_sealed: "{{ health.json.sealed | default(true) }}"

    - name: Initialize Vault (Shamir, {{ vault_key_shares }}/{{ vault_key_threshold }})
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/init"
        method: POST
        body_format: json
        body:
          secret_shares: "{{ vault_key_shares }}"
          secret_threshold: "{{ vault_key_threshold }}"
        status_code: 200
      register: init_resp
      when: not vault_initialized
      no_log: true

    - name: Persist init response when freshly initialized
      ansible.builtin.set_fact:
        unseal_keys: "{{ init_resp.json.keys_base64 }}"
        root_token: "{{ init_resp.json.root_token }}"
      when: not vault_initialized
      no_log: true

    - name: Store unseal keys in OS keystore
      ansible.builtin.include_role:
        name: os_keystore
        tasks_from: store
      vars:
        keystore_service: "{{ vault_keystore_prefix }}/unseal-{{ idx + 1 }}"
        keystore_value: "{{ item }}"
      loop: "{{ unseal_keys }}"
      loop_control:
        index_var: idx
        label: "unseal-{{ idx + 1 }}"
      when: not vault_initialized
      no_log: true

    - name: Store root token in OS keystore
      ansible.builtin.include_role:
        name: os_keystore
        tasks_from: store
      vars:
        keystore_service: "{{ vault_keystore_prefix }}/root-token"
        keystore_value: "{{ root_token }}"
      when: not vault_initialized
      no_log: true

    - name: Read all unseal keys from OS keystore (macOS)
      ansible.builtin.command:
        argv:
          - security
          - find-generic-password
          - -a
          - "{{ keystore_account }}"
          - -s
          - "{{ vault_keystore_prefix }}/unseal-{{ item }}"
          - -w
      register: __unseal_keys_macos
      loop: "{{ range(1, vault_key_shares + 1) | list }}"
      when: vault_initialized and vault_sealed and ansible_system == 'Darwin'
      no_log: true

    - name: Read all unseal keys from OS keystore (Linux)
      ansible.builtin.command:
        argv:
          - secret-tool
          - lookup
          - service
          - "{{ vault_keystore_prefix }}/unseal-{{ item }}"
          - account
          - "{{ keystore_account }}"
      register: __unseal_keys_linux
      loop: "{{ range(1, vault_key_shares + 1) | list }}"
      when: vault_initialized and vault_sealed and ansible_system == 'Linux'
      no_log: true

    - name: Build unseal-key list from keystore reads
      ansible.builtin.set_fact:
        unseal_keys: "{{ (__unseal_keys_macos.results | default([])
                          + __unseal_keys_linux.results | default([]))
                          | rejectattr('skipped', 'defined')
                          | map(attribute='stdout') | list }}"
      when: vault_initialized and vault_sealed
      no_log: true

    - name: Unseal Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/unseal"
        method: POST
        body_format: json
        body:
          key: "{{ item }}"
        status_code: 200
      loop: "{{ unseal_keys[:vault_key_threshold] }}"
      loop_control:
        label: "key-{{ ansible_loop.index | default('?') }}"
      when: vault_sealed
      no_log: true
      register: unseal_responses

    - name: Re-check health
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/health"
        status_code: [200, 429]
      register: post_unseal_health

    - name: Read root token from OS keystore (Darwin)
      ansible.builtin.command:
        argv:
          - security
          - find-generic-password
          - -a
          - "{{ keystore_account }}"
          - -s
          - "{{ vault_keystore_prefix }}/root-token"
          - -w
      when: ansible_system == 'Darwin'
      changed_when: false
      register: root_token_read_darwin
      no_log: true

    - name: Read root token from OS keystore (Linux)
      ansible.builtin.command:
        argv:
          - secret-tool
          - lookup
          - service
          - "{{ vault_keystore_prefix }}/root-token"
          - account
          - "{{ keystore_account }}"
      when: ansible_system == 'Linux'
      changed_when: false
      register: root_token_read_linux
      no_log: true

    - name: Set vault token fact
      ansible.builtin.set_fact:
        vault_admin_token: "{{ root_token_read_darwin.stdout if ansible_system == 'Darwin' else root_token_read_linux.stdout }}"
      no_log: true

    - name: Ensure KV v2 mount at secret/
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/mounts/secret"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_admin_token }}"
        body_format: json
        body:
          type: kv
          options:
            version: "2"
        status_code: [204, 400]

    - name: Print summary
      ansible.builtin.debug:
        msg: |
          Vault {{ post_unseal_health.json.version | default('?') }} ready at {{ vault_addr }}
          Initialized: {{ post_unseal_health.json.initialized }}
          Sealed: {{ post_unseal_health.json.sealed }}

          Unseal keys + root token are stored in the OS keystore under:
            {{ vault_keystore_prefix }}/unseal-1 .. unseal-{{ vault_key_shares }}
            {{ vault_keystore_prefix }}/root-token

          To export VAULT_TOKEN in your shell:
          {% if ansible_system == 'Darwin' %}
            export VAULT_TOKEN=$(security find-generic-password \
              -a {{ keystore_account }} -s {{ vault_keystore_prefix }}/root-token -w)
          {% else %}
            export VAULT_TOKEN=$(secret-tool lookup \
              service {{ vault_keystore_prefix }}/root-token account {{ keystore_account }})
          {% endif %}
            export VAULT_ADDR={{ vault_addr }}

          Re-running this playbook is safe: it detects an initialized+sealed Vault
          and unseals using keys from the OS keystore.
