model_list: []

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  allowed_routes:
    - /chat/completions
    - /models
    - /health
  disable_end_user_auth: true
  disable_mcp: true
  disable_admin_ui: true
  disable_user_management: true
  disable_jwt_auth: true
  disable_prompts_test: true

router_settings:
  routing_strategy: "latency-based-routing"
  enable_pre_call_checks: true

headroom_settings:
  enabled: true
  endpoint: "http://127.0.0.1:4001"
  model: "local"
  fallback: "direct"
