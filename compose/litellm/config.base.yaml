litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_end_user_auth: true
  # MCP endpoints stay disabled permanently (CVE-2026-42271). ToolHive is
  # Cove's only MCP surface — see docs/plans/toolhive-mcp-gateway.md. Do not
  # re-enable this "helpfully"; the guard test in cli/tests/test_toolhive.py
  # (TestLitellmMcpGuard) will fail.
  disable_mcp: true
  disable_user_management: false
  disable_jwt_auth: true

# Headroom compression is intentionally absent. LiteLLM 1.84.0 has no Headroom
# integration; it ships as a `guardrails:` entry in >=1.92. The former
# `headroom_settings:` block was silently ignored: the sidecar's own counters
# showed one request in its lifetime and zero compression jobs. Cove's Bifrost
# replacement does not carry compression either, so this is a capability that
# never ran, not one being dropped. Re-adding compression requires the
# `guardrails:` form and a LiteLLM pin >=1.92, with a test that fails on a pin
# that ignores it.
