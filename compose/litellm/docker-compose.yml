name: cove-litellm

services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${LITELLM_IMAGE:-cove-litellm:1.84.0}
    container_name: ${LITELLM_CONTAINER_NAME:-cove-litellm}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/litellm
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ${COVE_DATA_ROOT:-./data}/litellm/config.yaml:/app/config.yaml
    env_file:
      - ${COVE_DATA_ROOT:-./data}/litellm/local.env
    environment:
      LITELLM_CONFIG: /app/config.yaml
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4000/health/readiness"]
      interval: 15s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${LITELLM_MEM_LIMIT:-512M}

