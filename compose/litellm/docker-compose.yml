name: cove-litellm

services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    image: cove-litellm:1.84.0
    container_name: cove-litellm
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/litellm
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      LITELLM_CONFIG: /app/config.yaml
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4000/health"]
      interval: 15s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  headroom:
    image: ghcr.io/headroom-ai/headroom:0.1.0
    container_name: cove-headroom
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      HEADROOM_MODEL: local
      HEADROOM_PORT: "4001"
    deploy:
      resources:
        limits:
          memory: 256M
